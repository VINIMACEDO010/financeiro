<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>fin. — financeiro do casal</title>
<style>
  :root{
    --bg:#0c0f0e; --bg2:#12100e; --surface:#141917; --card:#171e1b; --card2:#1e2723;
    --line:#28322c; --line2:#334039; --txt:#eef4f0; --mut:#93a79b; --mut2:#6c7d73;
    --accent:#35c07a; --accent-d:#2aa566; --accent-ink:#04150c;
    --red:#f2645f; --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --amber:#e0a52e; --violet:#9085e9;
    --pos:#35c07a; --neg:#f2645f;
    --r:20px; --r2:14px;
    --sh:0 8px 30px rgba(0,0,0,.45); --sh2:0 2px 10px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.2px}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select{font-family:inherit;font-size:15px}
  .hide{display:none!important}
  .mut{color:var(--mut)} .mut2{color:var(--mut2)} .pos{color:var(--pos)} .neg{color:var(--neg)}
  .center{text-align:center}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh2)}
  .card h3{font-size:16px;margin-bottom:2px}
  .sub{font-size:12px;color:var(--mut2)}
  .pill{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line);font-weight:600}
  .pill.grn{background:rgba(53,192,122,.12);color:var(--accent);border-color:rgba(53,192,122,.3)}
  .btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 16px;border-radius:14px;width:100%;font-size:15px;transition:filter .15s}
  .btn:active{transform:translateY(1px)} .btn:hover{filter:brightness(1.05)}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid rgba(242,100,95,.4)}
  .btn.sm{width:auto;padding:10px 14px;font-size:13px;border-radius:11px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
  .field input,.field select{width:100%;padding:13px;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;color:var(--txt);outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;padding:10px 6px;background:transparent;color:var(--mut);font-weight:600;font-size:13px;border-radius:9px;transition:all .15s}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  /* header */
  .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 60%,rgba(12,15,14,.7));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .wrap{padding:12px 16px}
  .logo{font-weight:800;font-size:21px;letter-spacing:-1px}
  .logo b{color:var(--accent)}
  .monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
  .monthbar button{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;font-size:18px;line-height:1;color:var(--mut)}
  .monthbar .m{font-weight:700;font-size:15px;text-transform:capitalize;min-width:150px;text-align:center}
  /* hero */
  .hero{background:radial-gradient(140% 120% at 0% 0%,#173226 0%,#12211a 45%,#141917 100%);
    border:1px solid var(--line2);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
  .hero .l{font-size:13px;color:var(--mut)}
  .hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:2px}
  .hero .split{display:flex;gap:22px;margin-top:14px}
  .hero .split .l{font-size:12px}
  .hero .split .v{font-size:16px;font-weight:700;margin-top:2px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
  .kpi .l{font-size:12px;color:var(--mut)} .kpi .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
  /* list */
  .tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .tx:last-child{border-bottom:none}
  .ic{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;border:1px solid var(--line)}
  .tx .d{flex:1;min-width:0}
  .tx .d .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .d .s{font-size:12px;color:var(--mut2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tx .amt{font-weight:800;white-space:nowrap;letter-spacing:-.3px}
  .who{font-size:10px;padding:1px 7px;border-radius:6px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
  /* bars */
  .bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-top:7px}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s}
  .bar>i.over{background:var(--red)}
  .legdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
  /* fab + nav */
  .fab{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:30;
    width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:32px;
    box-shadow:0 8px 22px rgba(53,192,122,.4);display:flex;align-items:center;justify-content:center}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(18,22,20,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .nav .wrap{display:flex;padding:8px 8px;max-width:640px}
  .nav button{flex:1;background:transparent;color:var(--mut2);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px}
  .nav button.on{color:var(--accent)}
  .nav .ni{font-size:20px}
  /* modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  @keyframes fade{from{opacity:0}}
  .sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;border:1px solid var(--line);
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px)}}
  .sheet h3{margin-bottom:14px;font-size:18px}
  .grabber{width:42px;height:4px;background:var(--line2);border-radius:3px;margin:0 auto 16px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;
    background:#04150c;border:1px solid var(--accent);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--sh);animation:fade .15s}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:36px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .invhdr{font-size:12px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 9px;font-weight:700}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  table.mini th,table.mini td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
  table.mini th:first-child,table.mini td:first-child{text-align:left}
  table.mini th{color:var(--mut2);font-weight:600;font-size:11px}
  .chartwrap{margin-top:8px}
  .chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
  .lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px}
  .lg span{display:flex;align-items:center;gap:6px;color:var(--mut)}
  .empty{padding:26px;text-align:center;color:var(--mut2)}
</style>
</head>

<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL='https://dlndkrlcvmtirfwqiaos.supabase.co';
const SUPABASE_KEY='sb_publishable_bbLOUZjTd5c2PMd8RXKszw_bITygRFE';
const _sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ===================== STATE ===================== */
let currentUser=null,household=null,members=[],nameById={};
let dados=[],invs=[],snaps=[],bmarks={},customCats=[];
let curMonth=ymNow();
let _authMode='login',_onbMode='create';

const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MESLONG=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DEFAULT_CATS={
  d:["(D) Alimentação","(D) Carro","(D) Cavalo","(D) Casa","(D) Doação","(D) Gasolina","(D) Geral","(D) Lazer","(D) Manutenção","(D) Pessoal","(D) Planos","(D) Presentes","(D) Roupas","(D) Saúde","(D) Investimento"],
  r:["Salário","Rendimentos","Outros"]
};
const CAT_ICON={aliment:"🍽️",carro:"🚗",cavalo:"🐴",casa:"🏠",doa:"❤️",gasolina:"⛽",geral:"📦",lazer:"🎬",manuten:"🔧",pessoal:"🧍",plano:"📱",presente:"🎁",roupa:"👕",saude:"💊",saúde:"💊",invest:"📈",sal:"💰",rendiment:"📈",merc:"🛒"};
const CLASSES={reserva:{nome:"Reserva de emergência",ic:"🛟",cor:"var(--blue)",hex:"#3987e5"},
  renda_fixa:{nome:"Renda fixa",ic:"🏦",cor:"var(--aqua)",hex:"#199e70"},
  renda_variavel:{nome:"Renda variável",ic:"📈",cor:"var(--orange)",hex:"#d95926"}};

/* ===================== HELPERS ===================== */
function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymOf(s){return (s||'').slice(0,7);}
function firstOfMonth(ym){return ym+'-01';}
function money(v){return (v<0?'-':'')+'R$ '+Math.abs(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(v){return 'R$ '+Math.round(+v||0).toLocaleString('pt-BR');}
function pct(v,dg=2){return (v>0?'+':'')+(+v||0).toFixed(dg).replace('.',',')+'%';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catIcon(cat){const c=(cat||'').toLowerCase();for(const k in CAT_ICON)if(c.includes(k))return CAT_ICON[k];return "💸";}
function catShort(c){return (c||'').replace('(D) ','');}
function uid(){return Date.now()+''+Math.floor(Math.random()*1000);}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function allCats(tipo){const base=tipo==='r'?DEFAULT_CATS.r:DEFAULT_CATS.d;const ex=customCats.filter(c=>c.tipo===tipo).map(c=>c.nome);return [...new Set([...base,...ex])];}
function memberName(id){return nameById[id]||'—';}
function monthsBack(ym,n){const out=[];const[y,m]=ym.split('-').map(Number);for(let i=n-1;i>=0;i--){const d=new Date(y,m-1-i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}return out;}

/* ===================== SVG CHARTS ===================== */
function donut(items,size=150){ // items:[{label,value,hex}]
  const tot=items.reduce((s,i)=>s+i.value,0);const r=size/2,ir=r*0.62,cx=r,cy=r;
  if(tot<=0)return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none" stroke="var(--line)" stroke-width="${r-ir}"/></svg>`;
  let a=-Math.PI/2,seg='';
  items.forEach(it=>{if(it.value<=0)return;const frac=it.value/tot;const a2=a+frac*2*Math.PI;
    const gap=0.03; // pequeno espaço
    const s=a+gap/2,e=a2-gap/2;
    const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    const x3=cx+ir*Math.cos(e),y3=cy+ir*Math.sin(e),x4=cx+ir*Math.cos(s),y4=cy+ir*Math.sin(s);
    const large=(e-s)>Math.PI?1:0;
    seg+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${large} 0 ${x4} ${y4} Z" fill="${it.hex}"/>`;
    a=a2;});
  return `<svg viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">${seg}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--mut)" font-size="9">total</text>
    <text x="${cx}" y="${cy+11}" text-anchor="middle" fill="var(--txt)" font-size="13" font-weight="700">${money0(tot)}</text></svg>`;
}
function lineArea(pts,color='#35c07a',h=120){ // pts:[{x,y}]
  const w=560,pad=6,bottom=h-18,top=8;
  if(!pts.length)return '';
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys,0),mx=Math.max(...ys);if(mx===mn)mx=mn+1;
  const X=i=>pad+(pts.length===1?w/2:i*(w-pad*2)/(pts.length-1));
  const Y=v=>bottom-(v-mn)/(mx-mn)*(bottom-top);
  let d='',ar='';
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.y);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});
  ar=d+`L${X(pts.length-1).toFixed(1)} ${bottom} L${X(0).toFixed(1)} ${bottom} Z`;
  let dots='',labs='';
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.y);
    if(i===pts.length-1)dots+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${color}"/>`;
    labs+=`<text x="${x}" y="${h-4}" text-anchor="middle" fill="var(--mut2)" font-size="10">${esc(p.x)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${ar}" fill="url(#ga)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labs}</svg>`;
}
function groupBars(months,recArr,despArr,h=150){
  const max=Math.max(1,...recArr,...despArr);const n=months.length;const bw=100/n;
  let bars='';
  months.forEach((m,i)=>{const cx=i*bw+bw/2;const rh=recArr[i]/max*100,dh=despArr[i]/max*100;
    bars+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end">
      <div style="display:flex;gap:3px;align-items:flex-end;height:110px">
        <div style="width:10px;background:var(--aqua);border-radius:4px 4px 0 0;height:${rh}%"></div>
        <div style="width:10px;background:var(--red);border-radius:4px 4px 0 0;height:${dh}%"></div></div>
      <div style="font-size:10px;color:var(--mut2)">${MES[+m.slice(5,7)-1]}</div></div>`;});
  return `<div style="display:flex;gap:6px;align-items:flex-end">${bars}</div>`;
}

/* ===================== AUTH ===================== */
function authMode(m){_authMode=m;document.getElementById('tabLogin').classList.toggle('on',m==='login');
  document.getElementById('tabSignup').classList.toggle('on',m==='signup');
  document.getElementById('authBtnTxt').textContent=m==='login'?'Entrar':'Criar conta';document.getElementById('authMsg').textContent='';}
async function doAuth(){const email=document.getElementById('authEmail').value.trim();const pwd=document.getElementById('authPwd').value;
  const msg=document.getElementById('authMsg');msg.textContent='';if(!email||!pwd){msg.textContent='Preencha e-mail e senha';return;}
  try{let res;if(_authMode==='login')res=await _sb.auth.signInWithPassword({email,password:pwd});else res=await _sb.auth.signUp({email,password:pwd});
    if(res.error)throw res.error;
    if(_authMode==='signup'&&!res.data.session){msg.style.color='var(--accent)';msg.textContent='Conta criada! Confirme o e-mail (se pedido) e entre.';return;}
    await boot();}catch(e){msg.style.color='var(--red)';msg.textContent=traduzErro(e.message);}}
function traduzErro(m){m=m||'';if(/Invalid login/i.test(m))return'E-mail ou senha incorretos';
  if(/already registered/i.test(m))return'E-mail já cadastrado. Faça login.';if(/at least 6/i.test(m))return'A senha precisa de 6+ caracteres';return m;}
async function logout(){await _sb.auth.signOut();location.reload();}

/* ===================== ONBOARDING ===================== */
function onbMode(m){_onbMode=m;document.getElementById('onbTabCreate').classList.toggle('on',m==='create');
  document.getElementById('onbTabJoin').classList.toggle('on',m==='join');
  document.getElementById('onbCreate').classList.toggle('hide',m!=='create');document.getElementById('onbJoin').classList.toggle('hide',m!=='join');document.getElementById('onbMsg').textContent='';}
async function createHousehold(){const nome=document.getElementById('hhNome').value;const me=document.getElementById('hhMe').value;const msg=document.getElementById('onbMsg');msg.textContent='';
  if(!me.trim()){msg.textContent='Diga como você quer aparecer';return;}
  try{const{data,error}=await _sb.rpc('create_household',{p_nome:nome,p_display:me});if(error)throw error;household=data;await boot();}catch(e){msg.textContent=e.message;}}
async function joinHousehold(){const code=document.getElementById('joinCode').value;const me=document.getElementById('joinMe').value;const msg=document.getElementById('onbMsg');msg.textContent='';
  if(!code.trim()||!me.trim()){msg.textContent='Preencha o código e o seu nome';return;}
  try{const{data,error}=await _sb.rpc('join_household',{p_code:code,p_display:me});if(error)throw error;household=data;await boot();}catch(e){msg.textContent=e.message.includes('inválido')?'Código de convite inválido':e.message;}}

/* ===================== BOOT ===================== */
async function boot(){const{data:{user}}=await _sb.auth.getUser();if(!user){show('auth');return;}currentUser=user;
  const{data:mem}=await _sb.from('household_members').select('household_id,nome').eq('user_id',user.id).limit(1);
  if(!mem||!mem.length){show('onb');return;}
  const{data:hh}=await _sb.from('households').select('*').eq('id',mem[0].household_id).single();household=hh;
  show('app');document.getElementById('loading').classList.remove('hide');await loadAll();document.getElementById('loading').classList.add('hide');go('dash');}
async function loadAll(){const hid=household.id;
  const[mm,tx,cc,iv,sp,bm]=await Promise.all([
    _sb.from('household_members').select('user_id,nome,papel').eq('household_id',hid),
    _sb.from('transactions').select('*').eq('household_id',hid).order('data',{ascending:false}),
    _sb.from('custom_categories').select('*').eq('household_id',hid),
    _sb.from('investments').select('*').eq('household_id',hid).order('created_at'),
    _sb.from('investment_snapshots').select('*').eq('household_id',hid).order('ref_month'),
    _sb.from('benchmarks').select('*').eq('household_id',hid)]);
  members=mm.data||[];nameById={};members.forEach(m=>nameById[m.user_id]=m.nome);
  dados=(tx.data||[]).map(dbToLocal);customCats=(cc.data||[]).map(c=>({nome:c.nome,tipo:c.tipo}));
  invs=iv.data||[];snaps=sp.data||[];bmarks={};(bm.data||[]).forEach(b=>bmarks[ymOf(b.ref_month)]={cdi:b.cdi,ipca:b.ipca,ibov:b.ibov,fonte:b.fonte});
  document.getElementById('hhPill').textContent='🏠 '+(household.nome||'casa');}
function dbToLocal(r){return{id:r.id,createdBy:r.created_by,data:r.data,mes:r.mes,descricao:r.descricao,tipo:r.tipo,categoria:r.categoria,
  receita:+r.receita,despesa:+r.despesa,pagamento:r.pagamento||'debito',parcelas:r.parcelas||1,parcelaAtual:r.parcela_atual||1,grupoId:r.grupo_id||null};}
function localToDb(t){return{id:t.id,household_id:household.id,created_by:t.createdBy||currentUser.id,user_id:currentUser.id,data:t.data,mes:t.mes,descricao:t.descricao,
  tipo:t.tipo,categoria:t.categoria,receita:t.receita,despesa:t.despesa,pagamento:t.pagamento,parcelas:t.parcelas||1,parcela_atual:t.parcelaAtual||1,grupo_id:t.grupoId||null};}

/* ===================== NAV ===================== */
function show(v){['auth','onb','app'].forEach(x=>document.getElementById(x+'View').classList.toggle('hide',x!==v));}
let curPage='dash';
function go(pg){curPage=pg;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.pg===pg));
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hide'));
  document.getElementById('monthbar').style.display=(pg==='inv'||pg==='casa')?'none':'flex';
  document.getElementById('fab').style.display=(pg==='inv'||pg==='casa'||pg==='rep')?'none':'flex';
  ({dash:renderDash,tx:renderTx,inv:renderInv,rep:renderRep,casa:renderCasa}[pg])();
  document.getElementById('pg'+{dash:'Dash',tx:'Tx',inv:'Inv',rep:'Rep',casa:'Casa'}[pg]).classList.remove('hide');
  window.scrollTo(0,0);}
function shiftMonth(d){const[y,m]=curMonth.split('-').map(Number);const dt=new Date(y,m-1+d,1);curMonth=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');updateMonthLabel();
  if(curPage==='dash')renderDash();if(curPage==='tx')renderTx();if(curPage==='rep')renderRep();}
function updateMonthLabel(){const[y,m]=curMonth.split('-').map(Number);document.getElementById('monthLabel').textContent=MESLONG[m-1]+' '+y;}
function refreshCurrent(){({dash:renderDash,tx:renderTx,inv:renderInv,rep:renderRep,casa:renderCasa}[curPage])();}

/* ===================== DASHBOARD ===================== */
function monthTx(ym){return dados.filter(t=>ymOf(t.data)===ym);}
function renderDash(){updateMonthLabel();const tx=monthTx(curMonth);
  const rec=tx.reduce((s,t)=>s+(+t.receita||0),0),desp=tx.reduce((s,t)=>s+(+t.despesa||0),0),saldo=rec-desp;
  const byCat={};tx.forEach(t=>{if(t.despesa>0)byCat[t.categoria]=(byCat[t.categoria]||0)+t.despesa;});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const maxCat=cats.length?cats[0][1]:1;
  const byWho={};tx.forEach(t=>{if(t.despesa>0){const n=memberName(t.createdBy);byWho[n]=(byWho[n]||0)+t.despesa;}});
  const patr=patrimonioTotal();
  let h=`<div class="hero"><div class="l">Saldo do mês</div><div class="big ${saldo<0?'neg':'pos'}">${money(saldo)}</div>
    <div class="split"><div><div class="l mut">↑ Receitas</div><div class="v pos">${money(rec)}</div></div>
    <div><div class="l mut">↓ Despesas</div><div class="v neg">${money(desp)}</div></div></div></div>`;
  h+=`<div class="card" onclick="go('inv')" style="cursor:pointer"><div class="between"><div><h3>Patrimônio investido</h3><div class="sub">${invs.length} ativo(s) · ganho ${pct(patr.rent)}</div></div>
    <div style="text-align:right"><div style="font-size:22px;font-weight:800;letter-spacing:-.3px">${money(patr.saldo)}</div>
    <div class="${patr.ganho<0?'neg':'pos'}" style="font-size:13px;font-weight:600">${money(patr.ganho)}</div></div></div></div>`;
  if(Object.keys(byWho).length){const tot=Object.values(byWho).reduce((a,b)=>a+b,0)||1;
    h+=`<div class="card"><h3>Quem lançou</h3><div class="sub" style="margin-bottom:6px">despesas do mês</div>`;
    Object.entries(byWho).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{h+=`<div style="margin-top:11px"><div class="between"><span class="row"><span class="ic" style="width:26px;height:26px;font-size:13px">👤</span>${esc(n)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`;});
    h+=`</div>`;}
  h+=`<div class="card"><h3>Gastos por categoria</h3>`;
  if(!cats.length)h+=`<div class="empty">Nenhuma despesa neste mês.<br>Toque no + para adicionar.</div>`;
  cats.slice(0,8).forEach(([c,v])=>{h+=`<div style="margin-top:12px"><div class="between"><span class="row"><span>${catIcon(c)}</span>${esc(catShort(c))}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/maxCat*100}%"></i></div></div>`;});
  h+=`</div>`;
  document.getElementById('pgDash').innerHTML=h;}

/* ===================== LANÇAMENTOS ===================== */
let _txFilter='all';
function renderTx(){updateMonthLabel();let tx=monthTx(curMonth).slice().sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id));
  if(_txFilter==='rec')tx=tx.filter(t=>t.receita>0);if(_txFilter==='desp')tx=tx.filter(t=>t.despesa>0);
  const tot=tx.reduce((s,t)=>s+(t.receita>0?t.receita:-t.despesa),0);
  let h=`<div class="seg" style="margin-bottom:14px">
     <button class="${_txFilter==='all'?'on':''}" onclick="setTxFilter('all')">Tudo</button>
     <button class="${_txFilter==='desp'?'on':''}" onclick="setTxFilter('desp')">Despesas</button>
     <button class="${_txFilter==='rec'?'on':''}" onclick="setTxFilter('rec')">Receitas</button></div>`;
  h+=`<div class="card">`;
  if(!tx.length)h+=`<div class="empty">Nenhum lançamento neste mês.<br>Toque no + para adicionar.</div>`;
  let curDay='';
  tx.forEach(t=>{const isR=t.receita>0;const val=isR?t.receita:t.despesa;const dd=t.data.slice(8,10)+'/'+t.data.slice(5,7);
    if(dd!==curDay){curDay=dd;h+=`<div class="sub" style="margin:10px 0 2px;font-weight:600">${dd}</div>`;}
    h+=`<div class="tx" onclick="openTxModal('${t.id}')"><div class="ic">${catIcon(t.categoria)}</div>
      <div class="d"><div class="t">${esc(t.descricao||'(sem descrição)')}</div>
        <div class="s">${esc(catShort(t.categoria))} · ${t.pagamento}${t.parcelas>1?` · ${t.parcelaAtual}/${t.parcelas}`:''} <span class="who">${esc(memberName(t.createdBy))}</span></div></div>
      <div class="amt ${isR?'pos':'neg'}">${isR?'+':'-'}${money(val).replace('R$ ','')}</div></div>`;});
  h+=`</div>`;
  document.getElementById('pgTx').innerHTML=h;}
function setTxFilter(f){_txFilter=f;renderTx();}
function openTxModal(id){const t=id?dados.find(x=>x.id===id):null;const isEdit=!!t;const tipo=t?t.tipo:'Despesa';
  const valor=t?(t.receita>0?t.receita:t.despesa):'';const groupCount=t&&t.grupoId?dados.filter(x=>x.grupoId===t.grupoId).length:0;
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>${isEdit?'Editar lançamento':'Novo lançamento'}</h3>
    <div class="seg" id="tvTipo" style="margin-bottom:14px"><button class="${tipo==='Despesa'?'on':''}" onclick="setTv('Despesa')">Despesa</button><button class="${tipo==='Receita'?'on':''}" onclick="setTv('Receita')">Receita</button></div>
    <div class="field"><label>Descrição</label><input id="fDesc" value="${esc(t?t.descricao:'')}" placeholder="Ex: Mercado"></div>
    <div class="grid2"><div class="field"><label>Valor ${!isEdit?'(total)':''}</label><input id="fVal" type="number" inputmode="decimal" step="0.01" value="${valor}" placeholder="0,00"></div>
      <div class="field"><label>Data</label><input id="fData" type="date" value="${t?t.data:curMonth+'-'+String(new Date().getDate()).padStart(2,'0')}"></div></div>
    <div class="field"><label>Categoria</label><select id="fCat"></select></div>
    <div class="grid2"><div class="field"><label>Pagamento</label><select id="fPag"><option value="debito">Débito</option><option value="credito">Crédito</option><option value="pix">Pix</option></select></div>
      <div class="field" id="fParcW"><label>Parcelas</label><input id="fParc" type="number" min="1" step="1" value="${t?t.parcelas:1}"></div></div>
    ${isEdit&&groupCount>1?`<p class="sub">Parte de um parcelamento de ${groupCount}x. Editar altera só esta parcela.</p>`:''}
    <button class="btn" onclick="saveTx('${id||''}')">${isEdit?'Salvar alterações':'Adicionar'}</button>
    ${isEdit?`<button class="btn danger" style="margin-top:10px" onclick="delTx('${id}')">Excluir</button>${groupCount>1?`<button class="btn sec" style="margin-top:8px" onclick="delGroup('${t.grupoId}')">Excluir todas as ${groupCount} parcelas</button>`:''}`:''}
    <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Cancelar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;window._tv=tipo;fillCatSelect(t?t.categoria:'');
  document.getElementById('fPag').value=t?t.pagamento:'debito';if(isEdit)document.getElementById('fParcW').style.display='none';}
function setTv(v){window._tv=v;document.querySelectorAll('#tvTipo button').forEach(b=>b.classList.toggle('on',b.textContent===v));fillCatSelect('');}
function fillCatSelect(sel){const tipo=window._tv==='Receita'?'r':'d';const s=document.getElementById('fCat');s.innerHTML=allCats(tipo).map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
async function saveTx(id){const desc=document.getElementById('fDesc').value.trim();const val=parseFloat(document.getElementById('fVal').value);
  const data=document.getElementById('fData').value;const cat=document.getElementById('fCat').value;const pag=document.getElementById('fPag').value;const tipo=window._tv;
  if(!val||val<=0||!data){toast('Preencha valor e data');return;}const mes=MES[+data.slice(5,7)-1];
  if(id){const t=dados.find(x=>x.id===id);const patch={descricao:desc,data,mes,categoria:cat,pagamento:pag,receita:tipo==='Receita'?val:0,despesa:tipo==='Despesa'?val:0,tipo};
    const{error}=await _sb.from('transactions').update(patch).eq('id',id);if(error){toast('Erro ao salvar');return;}Object.assign(t,patch);
  }else{const parc=Math.max(1,parseInt(document.getElementById('fParc').value)||1);const rows=[];const grupo=parc>1?uid():null;const per=+(val/parc).toFixed(2);
    for(let i=0;i<parc;i++){const[y,m]=data.split('-').map(Number);const dt=new Date(y,m-1+i,Math.min(+data.slice(8,10),28));
      const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      rows.push({id:uid()+'_'+i,createdBy:currentUser.id,descricao:parc>1?`${desc} (${i+1}/${parc})`:desc,data:ds,mes:MES[dt.getMonth()],categoria:cat,tipo,pagamento:pag,
        receita:tipo==='Receita'?per:0,despesa:tipo==='Despesa'?per:0,parcelas:parc,parcelaAtual:i+1,grupoId:grupo});}
    const{error}=await _sb.from('transactions').insert(rows.map(localToDb));if(error){toast('Erro ao adicionar');return;}dados.push(...rows);}
  closeModal();refreshCurrent();toast('Salvo ✓');}
async function delTx(id){if(!confirm('Excluir este lançamento?'))return;const{error}=await _sb.from('transactions').delete().eq('id',id);
  if(error){toast('Erro');return;}dados=dados.filter(x=>x.id!==id);closeModal();refreshCurrent();toast('Excluído');}
async function delGroup(gid){if(!confirm('Excluir TODAS as parcelas?'))return;const{error}=await _sb.from('transactions').delete().eq('grupo_id',gid).eq('household_id',household.id);
  if(error){toast('Erro');return;}dados=dados.filter(x=>x.grupoId!==gid);closeModal();refreshCurrent();toast('Excluído');}

/* ===================== INVESTIMENTOS ===================== */
function invSnaps(id){return snaps.filter(s=>s.investment_id===id).sort((a,b)=>a.ref_month.localeCompare(b.ref_month));}
function invStats(id){const ss=invSnaps(id);if(!ss.length)return{saldo:0,investido:0,ganho:0,rent:0,lastRent:null,lastMonth:null,xirr:null};
  const saldo=+ss[ss.length-1].saldo;const investido=ss.reduce((s,x)=>s+(+x.aporte)-(+x.resgate),0);const ganho=saldo-investido;
  const rent=investido>0?ganho/investido*100:0;let lastRent=null;const last=ss[ss.length-1];
  if(ss.length>=2){const prev=ss[ss.length-2];const base=(+prev.saldo)+(+last.aporte);if(base>0)lastRent=((+last.saldo)-(+prev.saldo)-(+last.aporte)+(+last.resgate))/base*100;}
  else if(+last.aporte>0)lastRent=((+last.saldo)-(+last.aporte)+(+last.resgate))/(+last.aporte)*100;
  return{saldo,investido,ganho,rent,lastRent,lastMonth:ymOf(last.ref_month),xirr:xirrInv(id)};}
function xirrInv(id){const ss=invSnaps(id);if(ss.length<2)return null;const flows=[];
  ss.forEach(s=>{const amt=(+s.resgate)-(+s.aporte);if(amt!==0)flows.push({date:new Date(s.ref_month),amount:amt});});
  const last=ss[ss.length-1];flows.push({date:new Date(last.ref_month),amount:+last.saldo});
  return xirr(flows);}
function xirr(flows){if(flows.length<2)return null;const hasP=flows.some(f=>f.amount>0),hasN=flows.some(f=>f.amount<0);if(!hasP||!hasN)return null;
  const t0=flows[0].date.getTime();const yr=f=>(f.date.getTime()-t0)/(365*24*3600*1000);
  const npv=r=>flows.reduce((s,f)=>s+f.amount/Math.pow(1+r,yr(f)),0);
  let lo=-0.9999,hi=10,flo=npv(lo),fhi=npv(hi);if(flo*fhi>0)return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=npv(mid);if(Math.abs(fm)<1e-7)return mid;if(flo*fm<0){hi=mid;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;}
function patrimonioTotal(){let saldo=0,investido=0;invs.forEach(i=>{const s=invStats(i.id);saldo+=s.saldo;investido+=s.investido;});
  return{saldo,investido,ganho:saldo-investido,rent:investido>0?(saldo-investido)/investido*100:0};}
function patrimonioSerie(){ // total saldo por mês (carrega último saldo conhecido de cada ativo)
  const monthsSet=new Set();snaps.forEach(s=>monthsSet.add(ymOf(s.ref_month)));const months=[...monthsSet].sort();
  return months.map(ym=>{let tot=0;invs.forEach(i=>{const ss=invSnaps(i.id).filter(s=>ymOf(s.ref_month)<=ym);if(ss.length)tot+=+ss[ss.length-1].saldo;});
    return{x:MES[+ym.slice(5,7)-1],y:tot,ym};});}
function renderInv(){const patr=patrimonioTotal();const serie=patrimonioSerie();
  const alloc=['reserva','renda_fixa','renda_variavel'].map(cl=>{let v=0;invs.filter(i=>i.classe===cl).forEach(i=>v+=invStats(i.id).saldo);return{label:CLASSES[cl].nome,value:v,hex:CLASSES[cl].hex,cl};}).filter(a=>a.value>0);
  let h=`<div class="hero"><div class="l">Patrimônio investido</div><div class="big">${money(patr.saldo)}</div>
    <div class="split"><div><div class="l mut">Investido líq.</div><div class="v">${money(patr.investido)}</div></div>
    <div><div class="l mut">Ganho</div><div class="v ${patr.ganho<0?'neg':'pos'}">${money(patr.ganho)} <span style="font-size:12px">(${pct(patr.rent)})</span></div></div></div></div>`;
  if(serie.length>=2)h+=`<div class="card"><h3>Evolução do patrimônio</h3><div class="chartwrap">${lineArea(serie,'#35c07a',130)}</div></div>`;
  if(alloc.length)h+=`<div class="card"><h3>Alocação</h3><div class="chartwrap">${donut(alloc,150)}</div>
    <div class="lg">${alloc.map(a=>`<span><i class="legdot" style="background:${a.hex}"></i>${esc(CLASSES[a.cl].ic)} ${esc(a.label)} · <b style="color:var(--txt)">${(a.value/patr.saldo*100).toFixed(0)}%</b></span>`).join('')}</div></div>`;
  h+=`<div class="row" style="gap:8px;margin-bottom:6px"><button class="btn sm" onclick="openInvModal()">+ Novo investimento</button><button class="btn sm sec" onclick="openBenchModal()">📊 Índices</button></div>`;
  ['reserva','renda_fixa','renda_variavel'].forEach(cl=>{const list=invs.filter(i=>i.classe===cl);if(!list.length)return;
    h+=`<div class="invhdr">${CLASSES[cl].ic} ${CLASSES[cl].nome}</div>`;
    list.forEach(i=>{const s=invStats(i.id);const bm=s.lastMonth?bmarks[s.lastMonth]:null;const vsCdi=(s.lastRent!=null&&bm&&bm.cdi)?(s.lastRent/bm.cdi*100):null;
      h+=`<div class="card" style="margin-bottom:10px;padding:15px" onclick="openInvDetail('${i.id}')">
        <div class="between"><div><b>${esc(i.nome)}</b><div class="sub">${esc(i.instituicao||'')}${i.indexador?' · '+esc(i.indexador):''}</div></div>
        <div style="text-align:right"><b>${money(s.saldo)}</b><div class="${s.ganho<0?'neg':'pos'}" style="font-size:12px">${pct(s.rent)} acum.</div></div></div>
        ${s.lastRent!=null?`<div class="between" style="margin-top:9px;font-size:12px"><span class="mut">Mês (${s.lastMonth}): <b class="${s.lastRent<0?'neg':'pos'}">${pct(s.lastRent)}</b>${s.xirr!=null?` · XIRR <b class="${s.xirr<0?'neg':'pos'}">${pct(s.xirr*100)} a.a.</b>`:''}</span>${vsCdi!=null?`<span class="pill grn">${vsCdi.toFixed(0)}% do CDI</span>`:''}</div>`:'<div class="sub" style="margin-top:8px">Registre o saldo mensal para ver a rentabilidade</div>'}</div>`;});});
  if(!invs.length)h+=`<div class="card empty">Nenhum investimento ainda.<br>Toque em "Novo investimento".</div>`;
  document.getElementById('pgInv').innerHTML=h;}
function openInvModal(inv){const isE=!!inv;const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>${isE?'Editar investimento':'Novo investimento'}</h3>
    <div class="field"><label>Nome</label><input id="iNome" value="${esc(inv?inv.nome:'')}" placeholder="Ex: Tesouro Selic 2029"></div>
    <div class="field"><label>Classe</label><select id="iClasse"><option value="reserva">🛟 Reserva de emergência</option><option value="renda_fixa">🏦 Renda fixa</option><option value="renda_variavel">📈 Renda variável</option></select></div>
    <div class="grid2"><div class="field"><label>Instituição</label><input id="iInst" value="${esc(inv?inv.instituicao||'':'')}" placeholder="Ex: Nubank"></div>
      <div class="field"><label>Indexador</label><input id="iIdx" value="${esc(inv?inv.indexador||'':'')}" placeholder="CDI / IPCA+ / —"></div></div>
    <button class="btn" onclick="saveInv('${isE?inv.id:''}')">${isE?'Salvar':'Criar'}</button>
    ${isE?`<button class="btn danger" style="margin-top:10px" onclick="delInv('${inv.id}')">Excluir investimento</button>`:''}
    <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Cancelar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;if(isE)document.getElementById('iClasse').value=inv.classe;}
async function saveInv(id){const nome=document.getElementById('iNome').value.trim();if(!nome){toast('Dê um nome');return;}
  const rec={household_id:household.id,nome,classe:document.getElementById('iClasse').value,instituicao:document.getElementById('iInst').value.trim(),indexador:document.getElementById('iIdx').value.trim()};
  if(id){const{error}=await _sb.from('investments').update(rec).eq('id',id);if(error){toast('Erro');return;}Object.assign(invs.find(x=>x.id===id),rec);
  }else{rec.created_by=currentUser.id;const{data,error}=await _sb.from('investments').insert(rec).select().single();if(error){toast('Erro');return;}invs.push(data);}
  closeModal();renderInv();toast('Salvo ✓');}
async function delInv(id){if(!confirm('Excluir este investimento e todo o histórico?'))return;const{error}=await _sb.from('investments').delete().eq('id',id);
  if(error){toast('Erro');return;}invs=invs.filter(x=>x.id!==id);snaps=snaps.filter(s=>s.investment_id!==id);closeModal();renderInv();toast('Excluído');}
function openInvDetail(id){const inv=invs.find(x=>x.id===id);const ss=invSnaps(id);const st=invStats(id);
  let rows='';for(let k=ss.length-1;k>=0;k--){const s=ss[k];let rmes=null;
    if(k>=1){const prev=ss[k-1];const base=(+prev.saldo)+(+s.aporte);if(base>0)rmes=((+s.saldo)-(+prev.saldo)-(+s.aporte)+(+s.resgate))/base*100;}
    else if(+s.aporte>0)rmes=((+s.saldo)-(+s.aporte)+(+s.resgate))/(+s.aporte)*100;
    const bm=bmarks[ymOf(s.ref_month)];
    rows+=`<tr onclick="openSnapModal('${id}','${ymOf(s.ref_month)}')" style="cursor:pointer"><td>${ymOf(s.ref_month)}</td><td>${money(s.aporte).replace('R$ ','')}</td><td>${money(s.saldo).replace('R$ ','')}</td><td class="${rmes<0?'neg':'pos'}">${rmes==null?'—':pct(rmes)}</td><td class="mut">${bm&&bm.cdi?pct(bm.cdi):'—'}</td></tr>`;}
  const serie=ss.map(s=>({x:MES[+ymOf(s.ref_month).slice(5,7)-1],y:+s.saldo}));
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <div class="between"><h3>${esc(inv.nome)}</h3><button class="btn sm sec" onclick="openInvModal(invs.find(x=>x.id==='${id}'))">Editar</button></div>
    <div class="kpis" style="margin:12px 0"><div class="kpi"><div class="l">Saldo</div><div class="v">${money(st.saldo)}</div></div><div class="kpi"><div class="l">Ganho</div><div class="v ${st.ganho<0?'neg':'pos'}">${money(st.ganho)}</div></div>
      <div class="kpi"><div class="l">Rent. acumulada</div><div class="v ${st.rent<0?'neg':'pos'}">${pct(st.rent)}</div></div><div class="kpi"><div class="l">XIRR (a.a.)</div><div class="v ${st.xirr<0?'neg':'pos'}">${st.xirr==null?'—':pct(st.xirr*100)}</div></div></div>
    ${serie.length>=2?`<div class="chartwrap" style="margin-bottom:8px">${lineArea(serie,CLASSES[inv.classe].hex,110)}</div>`:''}
    <button class="btn" onclick="openSnapModal('${id}','')">+ Registrar saldo do mês</button>
    <div class="invhdr">Histórico mensal</div>
    ${ss.length?`<table class="mini"><tr><th>Mês</th><th>Aporte</th><th>Saldo</th><th>Rent.</th><th>CDI</th></tr>${rows}</table>`:'<div class="empty">Nenhum registro ainda.</div>'}
    <button class="btn sec" style="margin-top:14px" onclick="closeModal()">Fechar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;}
function openSnapModal(invId,ym){const ss=invSnaps(invId);const ex=ym?ss.find(s=>ymOf(s.ref_month)===ym):null;const defYm=ym||curMonth;
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>${ex?'Editar mês':'Registrar mês'}</h3>
    <div class="field"><label>Mês de referência</label><input id="sMes" type="month" value="${defYm}"></div>
    <div class="grid2"><div class="field"><label>Aporte no mês</label><input id="sAporte" type="number" step="0.01" value="${ex?ex.aporte:0}"></div>
      <div class="field"><label>Resgate no mês</label><input id="sResg" type="number" step="0.01" value="${ex?ex.resgate:0}"></div></div>
    <div class="field"><label>Saldo total no fim do mês</label><input id="sSaldo" type="number" step="0.01" value="${ex?ex.saldo:''}" placeholder="0,00"></div>
    <button class="btn" onclick="saveSnap('${invId}')">Salvar</button>
    ${ex?`<button class="btn danger" style="margin-top:10px" onclick="delSnap('${ex.id}','${invId}')">Excluir este mês</button>`:''}
    <button class="btn sec" style="margin-top:8px" onclick="openInvDetail('${invId}')">Voltar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;}
async function saveSnap(invId){const ym=document.getElementById('sMes').value;const saldo=parseFloat(document.getElementById('sSaldo').value);if(isNaN(saldo)){toast('Informe o saldo');return;}
  const rec={investment_id:invId,household_id:household.id,ref_month:firstOfMonth(ym),aporte:parseFloat(document.getElementById('sAporte').value)||0,resgate:parseFloat(document.getElementById('sResg').value)||0,saldo,created_by:currentUser.id};
  const{data,error}=await _sb.from('investment_snapshots').upsert(rec,{onConflict:'investment_id,ref_month'}).select().single();if(error){toast('Erro ao salvar');return;}
  snaps=snaps.filter(s=>!(s.investment_id===invId&&ymOf(s.ref_month)===ym));snaps.push(data);openInvDetail(invId);renderInv();toast('Salvo ✓');}
async function delSnap(id,invId){if(!confirm('Excluir este mês?'))return;const{error}=await _sb.from('investment_snapshots').delete().eq('id',id);if(error){toast('Erro');return;}
  snaps=snaps.filter(s=>s.id!==id);openInvDetail(invId);renderInv();toast('Excluído');}

/* ===================== BENCHMARKS ===================== */
function openBenchModal(){const ym=curMonth;const b=bmarks[ym]||{};
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>Índices do mês</h3><div class="field"><label>Mês</label><input id="bMes" type="month" value="${ym}" onchange="loadBenchInputs()"></div>
    <p class="sub" style="margin-top:0">Busque CDI e IPCA no Banco Central ou digite (% no mês). Ibovespa é manual.</p>
    <button class="btn sec" style="margin-bottom:12px" onclick="fetchBCB()">⤓ Buscar CDI e IPCA (BCB)</button>
    <div class="grid2"><div class="field"><label>CDI (% mês)</label><input id="bCdi" type="number" step="0.01" value="${b.cdi??''}"></div>
      <div class="field"><label>IPCA (% mês)</label><input id="bIpca" type="number" step="0.01" value="${b.ipca??''}"></div></div>
    <div class="field"><label>Ibovespa (% mês)</label><input id="bIbov" type="number" step="0.01" value="${b.ibov??''}"></div>
    <div id="bMsg" class="sub" style="min-height:16px"></div>
    <button class="btn" onclick="saveBench()">Salvar índices</button><button class="btn sec" style="margin-top:8px" onclick="closeModal()">Fechar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;}
function loadBenchInputs(){const ym=document.getElementById('bMes').value;const b=bmarks[ym]||{};document.getElementById('bCdi').value=b.cdi??'';document.getElementById('bIpca').value=b.ipca??'';document.getElementById('bIbov').value=b.ibov??'';}
async function fetchBCB(){const ym=document.getElementById('bMes').value;const msg=document.getElementById('bMsg');msg.style.color='var(--mut)';msg.textContent='Buscando no Banco Central…';
  try{const cdi=await sgs(4391);const ipca=await sgs(433);const key=`01/${ym.slice(5,7)}/${ym.slice(0,4)}`;
    const c=cdi.find(x=>x.data===key),ip=ipca.find(x=>x.data===key);
    if(c)document.getElementById('bCdi').value=(+c.valor).toFixed(2);if(ip)document.getElementById('bIpca').value=(+ip.valor).toFixed(2);
    if(c||ip){msg.style.color='var(--accent)';msg.textContent='Carregado do BCB ✓ (confira e salve)';}else{msg.style.color='var(--amber)';msg.textContent='Mês ainda não divulgado. Digite manualmente.';}
  }catch(e){msg.style.color='var(--amber)';msg.textContent='O navegador bloqueou a API do BCB. Digite os valores manualmente.';}}
async function sgs(cod){const r=await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados/ultimos/24?formato=json`);if(!r.ok)throw new Error('http');return r.json();}
async function saveBench(){const ym=document.getElementById('bMes').value;const rec={household_id:household.id,ref_month:firstOfMonth(ym),cdi:num(document.getElementById('bCdi').value),ipca:num(document.getElementById('bIpca').value),ibov:num(document.getElementById('bIbov').value),fonte:'app',updated_at:new Date().toISOString()};
  const{error}=await _sb.from('benchmarks').upsert(rec,{onConflict:'household_id,ref_month'});if(error){toast('Erro ao salvar');return;}
  bmarks[ym]={cdi:rec.cdi,ipca:rec.ipca,ibov:rec.ibov,fonte:'app'};closeModal();renderInv();toast('Índices salvos ✓');}
function num(v){return v===''||v==null?null:parseFloat(v);}

/* ===================== RELATÓRIOS ===================== */
function renderRep(){updateMonthLabel();const months=monthsBack(curMonth,6);
  const rec=months.map(ym=>monthTx(ym).reduce((s,t)=>s+(+t.receita||0),0));const desp=months.map(ym=>monthTx(ym).reduce((s,t)=>s+(+t.despesa||0),0));
  let h=`<div class="card"><h3>Receitas × Despesas</h3><div class="sub" style="margin-bottom:8px">últimos 6 meses</div>${groupBars(months,rec,desp)}
    <div class="lg"><span><i class="legdot" style="background:var(--aqua)"></i>Receitas</span><span><i class="legdot" style="background:var(--red)"></i>Despesas</span></div></div>`;
  const patr=patrimonioSerie();
  if(patr.length>=2)h+=`<div class="card"><h3>Evolução do patrimônio</h3><div class="chartwrap">${lineArea(patr,'#3987e5',120)}</div></div>`;
  const tx=monthTx(curMonth).filter(t=>t.despesa>0).sort((a,b)=>b.despesa-a.despesa).slice(0,6);
  h+=`<div class="card"><h3>Maiores gastos do mês</h3>`;if(!tx.length)h+=`<div class="empty">Sem despesas.</div>`;
  tx.forEach(t=>h+=`<div class="tx" style="cursor:default"><div class="ic">${catIcon(t.categoria)}</div><div class="d"><div class="t">${esc(t.descricao)}</div><div class="s">${esc(catShort(t.categoria))} · ${esc(memberName(t.createdBy))}</div></div><div class="amt neg">${money(t.despesa).replace('R$ ','')}</div></div>`);h+=`</div>`;
  const byWho={};months.forEach(ym=>monthTx(ym).forEach(t=>{if(t.despesa>0){const n=memberName(t.createdBy);byWho[n]=(byWho[n]||0)+t.despesa;}}));
  if(Object.keys(byWho).length){const tot=Object.values(byWho).reduce((a,b)=>a+b,0)||1;h+=`<div class="card"><h3>Quem gastou mais</h3><div class="sub" style="margin-bottom:6px">6 meses</div>`;
    Object.entries(byWho).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{h+=`<div style="margin-top:11px"><div class="between"><span>${esc(n)}</span><b>${money(v)} <span class="mut">(${(v/tot*100).toFixed(0)}%)</span></b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`;});h+=`</div>`;}
  document.getElementById('pgRep').innerHTML=h;}

/* ===================== CASA ===================== */
function renderCasa(){let h=`<div class="card"><h3>${esc(household.nome)}</h3>
    <div class="between" style="margin-top:12px"><div><div class="sub">Código de convite</div><div style="font-size:26px;font-weight:800;letter-spacing:3px">${esc(household.invite_code)}</div></div><button class="btn sm" onclick="copyCode()">Copiar</button></div>
    <p class="sub">Envie este código para seu par. Ele(a) cria a conta, escolhe "Entrar numa casa" e digita o código.</p></div>`;
  h+=`<div class="card"><h3>Membros</h3>`;members.forEach(m=>h+=`<div class="tx" style="cursor:default"><div class="ic">👤</div><div class="d"><div class="t">${esc(m.nome)}${m.user_id===currentUser.id?' <span class="who">você</span>':''}</div><div class="s">${esc(m.papel)}</div></div></div>`);h+=`</div>`;
  h+=`<div class="card"><div class="between"><h3>Categorias</h3><button class="btn sm sec" onclick="openCatModal()">Gerenciar</button></div><p class="sub">Padrão + personalizadas da casa.</p></div>`;
  h+=`<div class="card"><h3>Backup</h3><div class="row" style="gap:8px;margin-top:10px"><button class="btn sm" onclick="exportBackup()">💾 Exportar</button><button class="btn sm sec" onclick="document.getElementById('importFile').click()">📥 Importar</button></div><p class="sub">Importar substitui os lançamentos da casa pelos do arquivo.</p></div>`;
  h+=`<button class="btn sec" onclick="logout()">Sair da conta</button><p class="center sub" style="margin-top:16px">fin. · dados protegidos por RLS</p>`;
  document.getElementById('pgCasa').innerHTML=h;}
function copyCode(){navigator.clipboard?.writeText(household.invite_code);toast('Código copiado ✓');}
function openCatModal(){const list=t=>allCats(t).map(c=>{const custom=customCats.some(cc=>cc.nome===c&&cc.tipo===t);
    return `<div class="tx" style="cursor:default"><div class="ic">${catIcon(c)}</div><div class="d"><div class="t">${esc(c)}</div><div class="s">${custom?'personalizada':'padrão'}</div></div>${custom?`<button class="btn sm sec" onclick="renameCat('${esc(c)}','${t}')">✎</button> <button class="btn sm danger" onclick="delCat('${esc(c)}','${t}')">✕</button>`:''}</div>`;}).join('');
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div><h3>Categorias</h3>
    <div class="row" style="gap:8px;margin-bottom:12px"><input id="ncNome" placeholder="Nova categoria" style="flex:1;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt)"><select id="ncTipo" style="padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt)"><option value="d">Despesa</option><option value="r">Receita</option></select><button class="btn sm" onclick="addCat()">Add</button></div>
    <div class="invhdr">Despesas</div>${list('d')}<div class="invhdr">Receitas</div>${list('r')}<button class="btn sec" style="margin-top:14px" onclick="closeModal()">Fechar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;}
async function addCat(){const nome=document.getElementById('ncNome').value.trim();const tipo=document.getElementById('ncTipo').value;if(!nome){toast('Digite o nome');return;}if(allCats(tipo).includes(nome)){toast('Já existe');return;}
  const{error}=await _sb.from('custom_categories').insert({household_id:household.id,created_by:currentUser.id,nome,tipo,icone:catIcon(nome)});if(error){toast('Erro');return;}customCats.push({nome,tipo});openCatModal();toast('Adicionada ✓');}
async function delCat(nome,tipo){if(!confirm('Excluir a categoria "'+nome+'"?'))return;const{error}=await _sb.from('custom_categories').delete().eq('household_id',household.id).eq('nome',nome).eq('tipo',tipo);if(error){toast('Erro');return;}customCats=customCats.filter(c=>!(c.nome===nome&&c.tipo===tipo));openCatModal();toast('Excluída');}
async function renameCat(nome,tipo){const novo=prompt('Novo nome para "'+nome+'":',nome);if(!novo||novo.trim()===nome)return;const nn=novo.trim();
  const{error}=await _sb.from('custom_categories').update({nome:nn}).eq('household_id',household.id).eq('nome',nome).eq('tipo',tipo);if(error){toast('Erro');return;}
  await _sb.from('transactions').update({categoria:nn}).eq('household_id',household.id).eq('categoria',nome);dados.forEach(t=>{if(t.categoria===nome)t.categoria=nn;});customCats.forEach(c=>{if(c.nome===nome&&c.tipo===tipo)c.nome=nn;});openCatModal();toast('Renomeada ✓');}

/* ===================== BACKUP ===================== */
function exportBackup(){const cats={d:allCats('d'),r:allCats('r')};
  const payload=JSON.stringify({v:2,dados:dados.map(t=>({id:t.id,data:t.data,mes:t.mes,descricao:t.descricao,tipo:t.tipo,categoria:t.categoria,receita:t.receita,despesa:t.despesa,pagamento:t.pagamento,parcelas:t.parcelas,parcelaAtual:t.parcelaAtual,grupoId:t.grupoId})),cats},null,2);
  const blob=new Blob([payload],{type:'application/json'});const a=document.createElement('a');const d=new Date();a.download=`fin_backup_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;a.href=URL.createObjectURL(blob);a.click();toast('Backup baixado ✓');}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  if(!confirm('Importar vai SUBSTITUIR todos os lançamentos da casa pelos do arquivo. Continuar?')){e.target.value='';return;}
  try{const parsed=JSON.parse(await f.text());if(!parsed.dados)throw new Error('formato');document.getElementById('loading').classList.remove('hide');
    await _sb.from('transactions').delete().eq('household_id',household.id);
    const rows=parsed.dados.map(t=>localToDb({...t,createdBy:currentUser.id,parcelaAtual:t.parcelaAtual||t.parcela_atual,grupoId:t.grupoId||t.grupo_id}));
    for(let i=0;i<rows.length;i+=50)await _sb.from('transactions').insert(rows.slice(i,i+50));
    if(parsed.cats){for(const tp of ['d','r']){for(const nome of (parsed.cats[tp]||[])){if(!DEFAULT_CATS[tp].includes(nome)&&!customCats.some(c=>c.nome===nome&&c.tipo===tp)){await _sb.from('custom_categories').insert({household_id:household.id,created_by:currentUser.id,nome,tipo:tp,icone:catIcon(nome)}).then(()=>customCats.push({nome,tipo:tp}),()=>{});}}}}
    await loadAll();document.getElementById('loading').classList.add('hide');go('dash');toast('Backup importado ✓');
  }catch(err){document.getElementById('loading').classList.add('hide');alert('Arquivo inválido ou erro ao importar.');}e.target.value='';});

/* ===================== START ===================== */
_sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')show('auth');});
(async()=>{updateMonthLabel();const{data:{session}}=await _sb.auth.getSession();if(session)await boot();else show('auth');})();
</script>
