<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>fin. — financeiro do casal</title>
<style>
  :root{
    --bg:#0f1512; --bg2:#161e1a; --card:#1b241f; --card2:#212c26;
    --line:#2b382f; --txt:#eaf2ec; --mut:#8fa398; --accent:#38c172; --accent2:#2aa25f;
    --red:#ff6b6b; --blue:#5aa9ff; --amber:#ffc53d; --purple:#b98cff;
    --radius:16px; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:15px;line-height:1.4}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  h1,h2,h3{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select{font-family:inherit;font-size:15px}
  .hide{display:none!important}
  .mut{color:var(--mut)} .red{color:var(--red)} .grn{color:var(--accent)}
  .center{text-align:center}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
  .btn{background:var(--accent);color:#04160c;font-weight:700;padding:12px 16px;border-radius:12px;width:100%;font-size:15px}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn.sm{width:auto;padding:9px 13px;font-size:13px;border-radius:10px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
  .field input,.field select{width:100%;padding:12px;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;color:var(--txt);outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .seg button{flex:1;padding:11px 6px;background:transparent;color:var(--mut);font-weight:600;font-size:13px}
  .seg button.on{background:var(--accent);color:#04160c}
  /* header */
  .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg),rgba(15,21,18,.85));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top .wrap{padding:12px 16px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.5px}
  .logo span{color:var(--accent)}
  .monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .monthbar button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:18px;line-height:1}
  .monthbar .m{font-weight:700;font-size:15px;text-transform:capitalize}
  /* kpi */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
  .kpi .l{font-size:12px;color:var(--mut)} .kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  .kpi.big{grid-column:1/3;background:linear-gradient(135deg,#17251c,#132b1e)}
  .kpi.big .v{font-size:27px}
  /* list */
  .tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .tx:last-child{border-bottom:none}
  .ic{width:40px;height:40px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .tx .d{flex:1;min-width:0}
  .tx .d .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .d .s{font-size:12px;color:var(--mut);margin-top:2px}
  .tx .amt{font-weight:800;white-space:nowrap}
  .who{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
  /* bars */
  .bar{height:9px;background:var(--bg2);border-radius:6px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
  /* fab + nav */
  .fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;
    width:58px;height:58px;border-radius:50%;background:var(--accent);color:#04160c;font-size:30px;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .nav .wrap{display:flex;padding:6px 8px;max-width:640px}
  .nav button{flex:1;background:transparent;color:var(--mut);font-size:10px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px}
  .nav button.on{color:var(--accent)}
  .nav .ni{font-size:20px}
  /* modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg2);width:100%;max-width:640px;border-radius:20px 20px 0 0;border:1px solid var(--line);
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheet h3{margin-bottom:14px;font-size:17px}
  .grabber{width:40px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--mut);font-size:13px}
  .chip.on{background:var(--accent);color:#04160c;border-color:var(--accent);font-weight:700}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;
    background:#04160c;border:1px solid var(--accent);color:var(--txt);padding:11px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .invhdr{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;font-weight:700}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  table.mini th,table.mini td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
  table.mini th:first-child,table.mini td:first-child{text-align:left}
  table.mini th{color:var(--mut);font-weight:600;font-size:11px}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authView">
  <div class="wrap" style="padding-top:60px;max-width:420px">
    <div class="center" style="margin-bottom:26px">
      <div class="logo" style="font-size:38px">fin<span>.</span></div>
      <div class="mut" style="margin-top:6px">o financeiro de vocês dois</div>
    </div>
    <div class="card">
      <div class="seg" style="margin-bottom:16px">
        <button id="tabLogin" class="on" onclick="authMode('login')">Entrar</button>
        <button id="tabSignup" onclick="authMode('signup')">Criar conta</button>
      </div>
      <div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email" placeholder="voce@email.com"></div>
      <div class="field"><label>Senha</label><input id="authPwd" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn" onclick="doAuth()"><span id="authBtnTxt">Entrar</span></button>
      <div id="authMsg" class="center red" style="margin-top:10px;font-size:13px"></div>
    </div>
  </div>
</div>

<!-- ============ ONBOARDING (casa) ============ -->
<div id="onbView" class="hide">
  <div class="wrap" style="padding-top:40px;max-width:440px">
    <div class="center" style="margin-bottom:20px">
      <div class="logo" style="font-size:30px">fin<span>.</span></div>
      <div class="mut" style="margin-top:6px">Vamos configurar a sua casa</div>
    </div>
    <div class="card">
      <div class="seg" style="margin-bottom:16px">
        <button id="onbTabCreate" class="on" onclick="onbMode('create')">Criar uma casa</button>
        <button id="onbTabJoin" onclick="onbMode('join')">Entrar numa casa</button>
      </div>
      <div id="onbCreate">
        <p class="mut" style="font-size:13px;margin-top:0">Crie o cofre compartilhado. Depois você envia o código de convite para seu parceiro(a).</p>
        <div class="field"><label>Nome da casa</label><input id="hhNome" placeholder="Ex: Casa do Vini & Ana"></div>
        <div class="field"><label>Seu nome (como você aparece)</label><input id="hhMe" placeholder="Ex: Vini"></div>
        <button class="btn" onclick="createHousehold()">Criar casa</button>
      </div>
      <div id="onbJoin" class="hide">
        <p class="mut" style="font-size:13px;margin-top:0">Peça o código de convite para quem já criou a casa.</p>
        <div class="field"><label>Código de convite</label><input id="joinCode" placeholder="Ex: A1B2C3" style="text-transform:uppercase"></div>
        <div class="field"><label>Seu nome (como você aparece)</label><input id="joinMe" placeholder="Ex: Ana"></div>
        <button class="btn" onclick="joinHousehold()">Entrar na casa</button>
      </div>
      <div id="onbMsg" class="center red" style="margin-top:10px;font-size:13px"></div>
      <button class="btn sec" style="margin-top:14px" onclick="logout()">Sair</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hide">
  <div class="top">
    <div class="wrap">
      <div class="between">
        <div class="logo">fin<span>.</span></div>
        <div class="row">
          <span class="pill" id="hhPill">🏠 casa</span>
        </div>
      </div>
      <div class="monthbar" id="monthbar">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="m" id="monthLabel">—</div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
  </div>

  <div id="loading" class="wrap"><div class="spin"></div><div class="center mut">carregando…</div></div>

  <!-- DASHBOARD -->
  <div id="pgDash" class="wrap page hide"></div>
  <!-- LANÇAMENTOS -->
  <div id="pgTx" class="wrap page hide"></div>
  <!-- INVESTIMENTOS -->
  <div id="pgInv" class="wrap page hide"></div>
  <!-- RELATÓRIOS -->
  <div id="pgRep" class="wrap page hide"></div>
  <!-- CASA -->
  <div id="pgCasa" class="wrap page hide"></div>

  <button class="fab" id="fab" onclick="openTxModal()">+</button>

  <div class="nav">
    <div class="wrap">
      <button data-pg="dash" class="on" onclick="go('dash')"><span class="ni">🏠</span>Início</button>
      <button data-pg="tx" onclick="go('tx')"><span class="ni">📄</span>Lançar</button>
      <button data-pg="inv" onclick="go('inv')"><span class="ni">📈</span>Investir</button>
      <button data-pg="rep" onclick="go('rep')"><span class="ni">📊</span>Relatórios</button>
      <button data-pg="casa" onclick="go('casa')"><span class="ni">⚙️</span>Casa</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<input type="file" id="importFile" accept=".json" class="hide">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = 'https://dlndkrlcvmtirfwqiaos.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bbLOUZjTd5c2PMd8RXKszw_bITygRFE';
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================== STATE ===================== */
let currentUser=null, household=null, members=[], nameById={};
let dados=[], invs=[], snaps=[], bmarks={}; // bmarks: {"YYYY-MM":{cdi,ipca,ibov,fonte}}
let customCats=[]; // {nome,tipo}
let curMonth = ymNow();
let _authMode='login', _onbMode='create';

const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MESLONG=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DEFAULT_CATS={
  d:["(D) Alimentação","(D) Carro","(D) Cavalo","(D) Doação","(D) Gasolina","(D) Geral","(D) Manutenção","(D) Pessoal","(D) Planos","(D) Presentes","(D) Roupas","(D) Investimento"],
  r:["Salário","Rendimentos","Outros"]
};
const CAT_ICON={aliment:"🍽️",carro:"🚗",cavalo:"🐴",doa:"❤️",gasolina:"⛽",geral:"📦",manuten:"🔧",pessoal:"🧍",plano:"📱",presente:"🎁",roupa:"👕",invest:"📈",sal:"💰",rendiment:"📈",merc:"🛒"};
const CLASSES={reserva:{nome:"Reserva de emergência",ic:"🛟",cor:"var(--blue)"},renda_fixa:{nome:"Renda fixa",ic:"🏦",cor:"var(--accent)"},renda_variavel:{nome:"Renda variável",ic:"📈",cor:"var(--purple)"}};

/* ===================== HELPERS ===================== */
function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymOf(dateStr){return (dateStr||'').slice(0,7);}
function firstOfMonth(ym){return ym+'-01';}
function money(v){return (v<0?'-':'')+'R$ '+Math.abs(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(v,dg=2){return (v>0?'+':'')+(+v||0).toFixed(dg).replace('.',',')+'%';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catIcon(cat){const c=(cat||'').toLowerCase();for(const k in CAT_ICON)if(c.includes(k))return CAT_ICON[k];return "💸";}
function uid(){return Date.now()+''+Math.floor(Math.random()*1000);}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function allCats(tipo){const base=tipo==='r'?DEFAULT_CATS.r:DEFAULT_CATS.d;const extra=customCats.filter(c=>c.tipo===tipo).map(c=>c.nome);return [...new Set([...base,...extra])];}
function memberName(id){return nameById[id]||'—';}

/* ===================== AUTH ===================== */
function authMode(m){_authMode=m;document.getElementById('tabLogin').classList.toggle('on',m==='login');
  document.getElementById('tabSignup').classList.toggle('on',m==='signup');
  document.getElementById('authBtnTxt').textContent=m==='login'?'Entrar':'Criar conta';
  document.getElementById('authMsg').textContent='';}
async function doAuth(){
  const email=document.getElementById('authEmail').value.trim();
  const pwd=document.getElementById('authPwd').value;
  const msg=document.getElementById('authMsg');msg.textContent='';
  if(!email||!pwd){msg.textContent='Preencha e-mail e senha';return;}
  try{
    let res;
    if(_authMode==='login') res=await _sb.auth.signInWithPassword({email,password:pwd});
    else res=await _sb.auth.signUp({email,password:pwd});
    if(res.error) throw res.error;
    if(_authMode==='signup' && !res.data.session){msg.style.color='var(--accent)';msg.textContent='Conta criada! Confirme o e-mail (se pedido) e entre.';return;}
    await boot();
  }catch(e){msg.style.color='var(--red)';msg.textContent=traduzErro(e.message);}
}
function traduzErro(m){m=m||'';
  if(/Invalid login/i.test(m))return'E-mail ou senha incorretos';
  if(/already registered/i.test(m))return'E-mail já cadastrado. Faça login.';
  if(/at least 6/i.test(m))return'A senha precisa de 6+ caracteres';
  return m;}
async function logout(){await _sb.auth.signOut();location.reload();}

/* ===================== ONBOARDING ===================== */
function onbMode(m){_onbMode=m;document.getElementById('onbTabCreate').classList.toggle('on',m==='create');
  document.getElementById('onbTabJoin').classList.toggle('on',m==='join');
  document.getElementById('onbCreate').classList.toggle('hide',m!=='create');
  document.getElementById('onbJoin').classList.toggle('hide',m!=='join');
  document.getElementById('onbMsg').textContent='';}
async function createHousehold(){
  const nome=document.getElementById('hhNome').value;const me=document.getElementById('hhMe').value;
  const msg=document.getElementById('onbMsg');msg.textContent='';
  if(!me.trim()){msg.textContent='Diga como você quer aparecer';return;}
  try{const{data,error}=await _sb.rpc('create_household',{p_nome:nome,p_display:me});if(error)throw error;
    household=data;await boot();
  }catch(e){msg.textContent=e.message;}
}
async function joinHousehold(){
  const code=document.getElementById('joinCode').value;const me=document.getElementById('joinMe').value;
  const msg=document.getElementById('onbMsg');msg.textContent='';
  if(!code.trim()||!me.trim()){msg.textContent='Preencha o código e o seu nome';return;}
  try{const{data,error}=await _sb.rpc('join_household',{p_code:code,p_display:me});if(error)throw error;
    household=data;await boot();
  }catch(e){msg.textContent=e.message.includes('inválido')?'Código de convite inválido':e.message;}
}

/* ===================== BOOT / LOAD ===================== */
async function boot(){
  const{data:{user}}=await _sb.auth.getUser();
  if(!user){show('auth');return;}
  currentUser=user;
  // find household
  const{data:mem}=await _sb.from('household_members').select('household_id,nome').eq('user_id',user.id).limit(1);
  if(!mem||!mem.length){show('onb');return;}
  const hid=mem[0].household_id;
  const{data:hh}=await _sb.from('households').select('*').eq('id',hid).single();
  household=hh;
  show('app');
  document.getElementById('loading').classList.remove('hide');
  await loadAll();
  document.getElementById('loading').classList.add('hide');
  go('dash');
}
async function loadAll(){
  const hid=household.id;
  const[mm,tx,cc,iv,sp,bm]=await Promise.all([
    _sb.from('household_members').select('user_id,nome,papel').eq('household_id',hid),
    _sb.from('transactions').select('*').eq('household_id',hid).order('data',{ascending:false}),
    _sb.from('custom_categories').select('*').eq('household_id',hid),
    _sb.from('investments').select('*').eq('household_id',hid).order('created_at'),
    _sb.from('investment_snapshots').select('*').eq('household_id',hid).order('ref_month'),
    _sb.from('benchmarks').select('*').eq('household_id',hid)
  ]);
  members=mm.data||[];nameById={};members.forEach(m=>nameById[m.user_id]=m.nome);
  dados=(tx.data||[]).map(dbToLocal);
  customCats=(cc.data||[]).map(c=>({nome:c.nome,tipo:c.tipo}));
  invs=iv.data||[];snaps=sp.data||[];
  bmarks={};(bm.data||[]).forEach(b=>bmarks[ymOf(b.ref_month)]={cdi:b.cdi,ipca:b.ipca,ibov:b.ibov,fonte:b.fonte});
  document.getElementById('hhPill').textContent='🏠 '+(household.nome||'casa');
}
function dbToLocal(r){return{id:r.id,createdBy:r.created_by,data:r.data,mes:r.mes,descricao:r.descricao,
  tipo:r.tipo,categoria:r.categoria,receita:+r.receita,despesa:+r.despesa,pagamento:r.pagamento||'debito',
  parcelas:r.parcelas||1,parcelaAtual:r.parcela_atual||1,grupoId:r.grupo_id||null};}
function localToDb(t){return{id:t.id,household_id:household.id,created_by:t.createdBy||currentUser.id,user_id:currentUser.id,
  data:t.data,mes:t.mes,descricao:t.descricao,tipo:t.tipo,categoria:t.categoria,receita:t.receita,despesa:t.despesa,
  pagamento:t.pagamento,parcelas:t.parcelas||1,parcela_atual:t.parcelaAtual||1,grupo_id:t.grupoId||null};}

/* ===================== NAV ===================== */
function show(v){['auth','onb','app'].forEach(x=>document.getElementById(x+'View').classList.toggle('hide',x!==v));}
let curPage='dash';
function go(pg){curPage=pg;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.pg===pg));
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hide'));
  document.getElementById('monthbar').style.display=(pg==='inv'||pg==='casa')?'none':'flex';
  document.getElementById('fab').style.display=(pg==='inv'||pg==='casa'||pg==='rep')?'none':'flex';
  if(pg==='dash'){renderDash();document.getElementById('pgDash').classList.remove('hide');}
  if(pg==='tx'){renderTx();document.getElementById('pgTx').classList.remove('hide');}
  if(pg==='inv'){renderInv();document.getElementById('pgInv').classList.remove('hide');}
  if(pg==='rep'){renderRep();document.getElementById('pgRep').classList.remove('hide');}
  if(pg==='casa'){renderCasa();document.getElementById('pgCasa').classList.remove('hide');}
}
function shiftMonth(d){const[y,m]=curMonth.split('-').map(Number);const dt=new Date(y,m-1+d,1);
  curMonth=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');updateMonthLabel();
  if(curPage==='dash')renderDash();if(curPage==='tx')renderTx();if(curPage==='rep')renderRep();}
function updateMonthLabel(){const[y,m]=curMonth.split('-').map(Number);
  document.getElementById('monthLabel').textContent=MESLONG[m-1]+' '+y;}

/* ===================== DASHBOARD ===================== */
function monthTx(ym){return dados.filter(t=>ymOf(t.data)===ym);}
function renderDash(){updateMonthLabel();
  const tx=monthTx(curMonth);
  const rec=tx.reduce((s,t)=>s+(+t.receita||0),0);
  const desp=tx.reduce((s,t)=>s+(+t.despesa||0),0);
  const saldo=rec-desp;
  // por categoria (despesa)
  const byCat={};tx.forEach(t=>{if(t.despesa>0)byCat[t.categoria]=(byCat[t.categoria]||0)+t.despesa;});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats.length?cats[0][1]:1;
  // por pessoa
  const byWho={};tx.forEach(t=>{if(t.despesa>0){const n=memberName(t.createdBy);byWho[n]=(byWho[n]||0)+t.despesa;}});
  // investimentos total
  const patr=patrimonioTotal();
  let h=`<div class="kpis">
    <div class="kpi big"><div class="l">Saldo do mês</div><div class="v ${saldo<0?'red':'grn'}">${money(saldo)}</div></div>
    <div class="kpi"><div class="l">Receitas</div><div class="v grn">${money(rec)}</div></div>
    <div class="kpi"><div class="l">Despesas</div><div class="v red">${money(desp)}</div></div>
  </div>`;
  h+=`<div class="card"><div class="between"><h3>Patrimônio investido</h3><span class="pill">📈 ${invs.length} ativo(s)</span></div>
    <div class="v" style="font-size:26px;font-weight:800;margin-top:6px">${money(patr.saldo)}</div>
    <div class="mut" style="font-size:13px">Investido líq.: ${money(patr.investido)} · Ganho: <span class="${patr.ganho<0?'red':'grn'}">${money(patr.ganho)} (${pct(patr.rent)})</span></div>
    <button class="btn sec sm" style="margin-top:10px" onclick="go('inv')">Ver investimentos →</button></div>`;
  // quem gastou
  if(Object.keys(byWho).length){
    h+=`<div class="card"><h3>Quem lançou (despesas do mês)</h3>`;
    const tot=Object.values(byWho).reduce((a,b)=>a+b,0)||1;
    Object.entries(byWho).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{
      h+=`<div style="margin-top:10px"><div class="between"><span>${esc(n)}</span><b>${money(v)}</b></div>
        <div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`;});
    h+=`</div>`;
  }
  // categorias
  h+=`<div class="card"><h3>Gastos por categoria</h3>`;
  if(!cats.length)h+=`<p class="mut">Nenhuma despesa neste mês.</p>`;
  cats.slice(0,8).forEach(([c,v])=>{h+=`<div style="margin-top:11px"><div class="between"><span class="row"><span>${catIcon(c)}</span> ${esc(c.replace('(D) ',''))}</span><b>${money(v)}</b></div>
    <div class="bar"><i style="width:${v/maxCat*100}%"></i></div></div>`;});
  h+=`</div>`;
  document.getElementById('pgDash').innerHTML=h;
}

/* ===================== LANÇAMENTOS (CRUD) ===================== */
let _txFilter='all';
function renderTx(){updateMonthLabel();
  let tx=monthTx(curMonth).slice().sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id));
  if(_txFilter==='rec')tx=tx.filter(t=>t.receita>0);
  if(_txFilter==='desp')tx=tx.filter(t=>t.despesa>0);
  let h=`<div class="seg" style="margin-bottom:12px">
     <button class="${_txFilter==='all'?'on':''}" onclick="setTxFilter('all')">Tudo</button>
     <button class="${_txFilter==='desp'?'on':''}" onclick="setTxFilter('desp')">Despesas</button>
     <button class="${_txFilter==='rec'?'on':''}" onclick="setTxFilter('rec')">Receitas</button></div>`;
  h+=`<div class="card">`;
  if(!tx.length)h+=`<p class="mut center" style="padding:20px 0">Nenhum lançamento neste mês.<br>Toque no + para adicionar.</p>`;
  tx.forEach(t=>{const isR=t.receita>0;const val=isR?t.receita:t.despesa;
    h+=`<div class="tx" onclick="openTxModal('${t.id}')">
      <div class="ic">${catIcon(t.categoria)}</div>
      <div class="d"><div class="t">${esc(t.descricao||'(sem descrição)')}</div>
        <div class="s">${esc(t.categoria.replace('(D) ',''))} · ${t.pagamento}${t.parcelas>1?` · ${t.parcelaAtual}/${t.parcelas}`:''} · <span class="who">${esc(memberName(t.createdBy))}</span></div></div>
      <div class="amt ${isR?'grn':'red'}">${isR?'+':'-'}${money(val).replace('R$ ','')}</div></div>`;});
  h+=`</div>`;
  document.getElementById('pgTx').innerHTML=h;
}
function setTxFilter(f){_txFilter=f;renderTx();}

function openTxModal(id){
  const t=id?dados.find(x=>x.id===id):null;
  const isEdit=!!t;
  const tipo=t?t.tipo:'Despesa';
  const valor=t?(t.receita>0?t.receita:t.despesa):'';
  const groupCount=t&&t.grupoId?dados.filter(x=>x.grupoId===t.grupoId).length:0;
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
    <div class="grabber"></div>
    <h3>${isEdit?'Editar lançamento':'Novo lançamento'}</h3>
    <div class="seg" id="tvTipo" style="margin-bottom:14px">
      <button class="${tipo==='Despesa'?'on':''}" onclick="setTv('Despesa')">Despesa</button>
      <button class="${tipo==='Receita'?'on':''}" onclick="setTv('Receita')">Receita</button></div>
    <div class="field"><label>Descrição</label><input id="fDesc" value="${esc(t?t.descricao:'')}" placeholder="Ex: Mercado"></div>
    <div class="grid2">
      <div class="field"><label>Valor ${!isEdit?'(total)':''}</label><input id="fVal" type="number" inputmode="decimal" step="0.01" value="${valor}" placeholder="0,00"></div>
      <div class="field"><label>Data</label><input id="fData" type="date" value="${t?t.data:curMonth+'-'+String(new Date().getDate()).padStart(2,'0')}"></div>
    </div>
    <div class="field"><label>Categoria</label><select id="fCat"></select></div>
    <div class="grid2">
      <div class="field"><label>Pagamento</label><select id="fPag">
        <option value="debito">Débito</option><option value="credito">Crédito</option><option value="pix">Pix</option></select></div>
      <div class="field" id="fParcW"><label>Parcelas</label><input id="fParc" type="number" min="1" step="1" value="${t?t.parcelas:1}"></div>
    </div>
    ${isEdit&&groupCount>1?`<p class="mut" style="font-size:12px">Este lançamento faz parte de um parcelamento de ${groupCount}x. Editar aqui altera só esta parcela; excluir apaga só ela.</p>`:''}
    <button class="btn" onclick="saveTx('${id||''}')">${isEdit?'Salvar alterações':'Adicionar'}</button>
    ${isEdit?`<button class="btn danger" style="margin-top:10px" onclick="delTx('${id}')">Excluir</button>${groupCount>1?`<button class="btn sec" style="margin-top:8px" onclick="delGroup('${t.grupoId}')">Excluir todas as ${groupCount} parcelas</button>`:''}`:''}
    <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Cancelar</button>
  </div></div>`;
  document.getElementById('modalRoot').innerHTML=m;
  window._tv=tipo;window._pag=t?t.pagamento:'debito';
  fillCatSelect(t?t.categoria:'');
  document.getElementById('fPag').value=t?t.pagamento:'debito';
  if(isEdit)document.getElementById('fParcW').style.display='none';
}
function setTv(v){window._tv=v;document.querySelectorAll('#tvTipo button').forEach(b=>b.classList.toggle('on',b.textContent===v));fillCatSelect('');}
function fillCatSelect(sel){const tipo=window._tv==='Receita'?'r':'d';const s=document.getElementById('fCat');
  s.innerHTML=allCats(tipo).map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

async function saveTx(id){
  const desc=document.getElementById('fDesc').value.trim();
  const val=parseFloat(document.getElementById('fVal').value);
  const data=document.getElementById('fData').value;
  const cat=document.getElementById('fCat').value;
  const pag=document.getElementById('fPag').value;
  const tipo=window._tv;
  if(!val||val<=0||!data){toast('Preencha valor e data');return;}
  const mes=MES[+data.slice(5,7)-1];
  if(id){ // EDIT single
    const t=dados.find(x=>x.id===id);
    const patch={descricao:desc,data,mes,categoria:cat,pagamento:pag,
      receita:tipo==='Receita'?val:0,despesa:tipo==='Despesa'?val:0,tipo};
    const{error}=await _sb.from('transactions').update(patch).eq('id',id);
    if(error){toast('Erro ao salvar');return;}
    Object.assign(t,patch);
  }else{ // CREATE (com parcelamento)
    const parc=Math.max(1,parseInt(document.getElementById('fParc').value)||1);
    const rows=[];const grupo=parc>1?uid():null;const per=+(val/parc).toFixed(2);
    for(let i=0;i<parc;i++){
      const[y,m]=data.split('-').map(Number);const dt=new Date(y,m-1+i,Math.min(+data.slice(8,10),28));
      const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      rows.push({id:uid()+'_'+i,createdBy:currentUser.id,descricao:parc>1?`${desc} (${i+1}/${parc})`:desc,
        data:ds,mes:MES[dt.getMonth()],categoria:cat,tipo,pagamento:pag,
        receita:tipo==='Receita'?per:0,despesa:tipo==='Despesa'?per:0,parcelas:parc,parcelaAtual:i+1,grupoId:grupo});
    }
    const{error}=await _sb.from('transactions').insert(rows.map(localToDb));
    if(error){toast('Erro ao adicionar');return;}
    dados.push(...rows);
  }
  closeModal();refreshCurrent();toast('Salvo ✓');
}
async function delTx(id){if(!confirm('Excluir este lançamento?'))return;
  const{error}=await _sb.from('transactions').delete().eq('id',id);
  if(error){toast('Erro ao excluir');return;}
  dados=dados.filter(x=>x.id!==id);closeModal();refreshCurrent();toast('Excluído');}
async function delGroup(gid){if(!confirm('Excluir TODAS as parcelas deste parcelamento?'))return;
  const{error}=await _sb.from('transactions').delete().eq('grupo_id',gid).eq('household_id',household.id);
  if(error){toast('Erro ao excluir');return;}
  dados=dados.filter(x=>x.grupoId!==gid);closeModal();refreshCurrent();toast('Parcelamento excluído');}
function refreshCurrent(){if(curPage==='dash')renderDash();if(curPage==='tx')renderTx();if(curPage==='rep')renderRep();if(curPage==='inv')renderInv();}

/* ===================== INVESTIMENTOS ===================== */
function invSnaps(invId){return snaps.filter(s=>s.investment_id===invId).sort((a,b)=>a.ref_month.localeCompare(b.ref_month));}
function invStats(invId){
  const ss=invSnaps(invId);if(!ss.length)return{saldo:0,investido:0,ganho:0,rent:0,lastRent:null,lastMonth:null};
  const saldo=+ss[ss.length-1].saldo;
  const investido=ss.reduce((s,x)=>s+(+x.aporte)-(+x.resgate),0);
  const ganho=saldo-investido;
  const rent=investido>0?ganho/investido*100:0;
  // rentabilidade do último mês
  let lastRent=null;const last=ss[ss.length-1];
  if(ss.length>=2){const prev=ss[ss.length-2];const base=(+prev.saldo)+(+last.aporte);
    if(base>0)lastRent=((+last.saldo)-(+prev.saldo)-(+last.aporte)+(+last.resgate))/base*100;}
  else if(+last.aporte>0){lastRent=((+last.saldo)-(+last.aporte)+(+last.resgate))/(+last.aporte)*100;}
  return{saldo,investido,ganho,rent,lastRent,lastMonth:ymOf(last.ref_month)};
}
function patrimonioTotal(){let saldo=0,investido=0;invs.forEach(i=>{const s=invStats(i.id);saldo+=s.saldo;investido+=s.investido;});
  return{saldo,investido,ganho:saldo-investido,rent:investido>0?(saldo-investido)/investido*100:0};}
function renderInv(){
  const patr=patrimonioTotal();
  let h=`<div class="kpi big" style="margin-bottom:14px"><div class="l">Patrimônio total investido</div>
    <div class="v">${money(patr.saldo)}</div>
    <div class="mut" style="font-size:13px;margin-top:4px">Investido líq.: ${money(patr.investido)} · Ganho <span class="${patr.ganho<0?'red':'grn'}">${money(patr.ganho)} (${pct(patr.rent)})</span></div></div>`;
  h+=`<div class="row" style="gap:8px;margin-bottom:6px"><button class="btn sm" onclick="openInvModal()">+ Novo investimento</button>
      <button class="btn sm sec" onclick="openBenchModal()">📊 Índices</button></div>`;
  ['reserva','renda_fixa','renda_variavel'].forEach(cl=>{
    const list=invs.filter(i=>i.classe===cl);if(!list.length)return;
    h+=`<div class="invhdr">${CLASSES[cl].ic} ${CLASSES[cl].nome}</div>`;
    list.forEach(i=>{const s=invStats(i.id);const bm=s.lastMonth?bmarks[s.lastMonth]:null;
      const vsCdi=(s.lastRent!=null&&bm&&bm.cdi)?(s.lastRent/bm.cdi*100):null;
      h+=`<div class="card" style="margin-bottom:10px" onclick="openInvDetail('${i.id}')">
        <div class="between"><div><b>${esc(i.nome)}</b><div class="mut" style="font-size:12px">${esc(i.instituicao||'')}${i.indexador?' · '+esc(i.indexador):''}</div></div>
        <div style="text-align:right"><b>${money(s.saldo)}</b><div class="${s.ganho<0?'red':'grn'}" style="font-size:12px">${pct(s.rent)} acum.</div></div></div>
        ${s.lastRent!=null?`<div class="between" style="margin-top:8px;font-size:12px"><span class="mut">No mês (${s.lastMonth}): <b class="${s.lastRent<0?'red':'grn'}">${pct(s.lastRent)}</b></span>
          ${vsCdi!=null?`<span class="pill">${vsCdi.toFixed(0)}% do CDI</span>`:''}</div>`:'<div class="mut" style="font-size:12px;margin-top:6px">Registre o saldo mensal para ver a rentabilidade</div>'}
      </div>`;});
  });
  if(!invs.length)h+=`<div class="card center mut" style="padding:26px">Nenhum investimento ainda.<br>Toque em "Novo investimento".</div>`;
  document.getElementById('pgInv').innerHTML=h;
}
function openInvModal(inv){const isE=!!inv;
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>${isE?'Editar investimento':'Novo investimento'}</h3>
    <div class="field"><label>Nome</label><input id="iNome" value="${esc(inv?inv.nome:'')}" placeholder="Ex: Tesouro Selic 2029"></div>
    <div class="field"><label>Classe</label><select id="iClasse">
      <option value="reserva">🛟 Reserva de emergência</option>
      <option value="renda_fixa">🏦 Renda fixa</option>
      <option value="renda_variavel">📈 Renda variável</option></select></div>
    <div class="grid2">
      <div class="field"><label>Instituição</label><input id="iInst" value="${esc(inv?inv.instituicao||'':'')}" placeholder="Ex: Nubank"></div>
      <div class="field"><label>Indexador</label><input id="iIdx" value="${esc(inv?inv.indexador||'':'')}" placeholder="CDI / IPCA+ / —"></div>
    </div>
    <button class="btn" onclick="saveInv('${isE?inv.id:''}')">${isE?'Salvar':'Criar'}</button>
    ${isE?`<button class="btn danger" style="margin-top:10px" onclick="delInv('${inv.id}')">Excluir investimento</button>`:''}

}
async function saveInv(id){
  const nome=document.getElementById('iNome').value.trim();
  if(!nome){toast('Dê um nome');return;}
  const rec={household_id:household.id,nome,classe:document.getElementById('iClasse').value,
    instituicao:document.getElementById('iInst').value.trim(),indexador:document.getElementById('iIdx').value.trim()};
  if(id){const{error}=await _sb.from('investments').update(rec).eq('id',id);if(error){toast('Erro');return;}
    const i=invs.find(x=>x.id===id);Object.assign(i,rec);
  }else{rec.created_by=currentUser.id;const{data,error}=await _sb.from('investments').insert(rec).select().single();
    if(error){toast('Erro');return;}invs.push(data);}
  closeModal();renderInv();toast('Salvo ✓');
}
async function delInv(id){if(!confirm('Excluir este investimento e todo o histórico dele?'))return;
  const{error}=await _sb.from('investments').delete().eq('id',id);if(error){toast('Erro');return;}
  invs=invs.filter(x=>x.id!==id);snaps=snaps.filter(s=>s.investment_id!==id);closeModal();renderInv();toast('Excluído');}

function openInvDetail(id){const inv=invs.find(x=>x.id===id);const ss=invSnaps(id);const st=invStats(id);
  let rows='';for(let k=ss.length-1;k>=0;k--){const s=ss[k];let rmes=null;
    if(k>=1){const prev=ss[k-1];const base=(+prev.saldo)+(+s.aporte);if(base>0)rmes=((+s.saldo)-(+prev.saldo)-(+s.aporte)+(+s.resgate))/base*100;}
    else if(+s.aporte>0)rmes=((+s.saldo)-(+s.aporte)+(+s.resgate))/(+s.aporte)*100;
    const bm=bmarks[ymOf(s.ref_month)];
    rows+=`<tr onclick="openSnapModal('${id}','${ymOf(s.ref_month)}')" style="cursor:pointer">
      <td>${ymOf(s.ref_month)}</td><td>${money(s.aporte).replace('R$ ','')}</td>
      <td>${money(s.saldo).replace('R$ ','')}</td>
      <td class="${rmes<0?'red':'grn'}">${rmes==null?'—':pct(rmes)}</td>
      <td class="mut">${bm&&bm.cdi?pct(bm.cdi):'—'}</td></tr>`;}
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <div class="between"><h3>${esc(inv.nome)}</h3><button class="btn sm sec" onclick="openInvModal(invs.find(x=>x.id==='${id}'))">Editar</button></div>
    <div class="kpis" style="margin:12px 0">
      <div class="kpi"><div class="l">Saldo atual</div><div class="v">${money(st.saldo)}</div></div>
      <div class="kpi"><div class="l">Ganho</div><div class="v ${st.ganho<0?'red':'grn'}">${money(st.ganho)}</div></div></div>
    <button class="btn" onclick="openSnapModal('${id}','')">+ Registrar saldo do mês</button>
    <div class="invhdr">Histórico mensal</div>
    ${ss.length?`<table class="mini"><tr><th>Mês</th><th>Aporte</th><th>Saldo</th><th>Rent.</th><th>CDI</th></tr>${rows}</table>`:'<p class="mut">Nenhum registro ainda.</p>'}
    <button class="btn sec" style="margin-top:14px" onclick="closeModal()">Fechar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;
}
function openSnapModal(invId,ym){const ss=invSnaps(invId);const ex=ym?ss.find(s=>ymOf(s.ref_month)===ym):null;
  const defYm=ym||curMonth;
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>${ex?'Editar mês':'Registrar mês'}</h3>
    <div class="field"><label>Mês de referência</label><input id="sMes" type="month" value="${defYm}"></div>
    <div class="grid2">
      <div class="field"><label>Aporte no mês</label><input id="sAporte" type="number" step="0.01" value="${ex?ex.aporte:0}"></div>
      <div class="field"><label>Resgate no mês</label><input id="sResg" type="number" step="0.01" value="${ex?ex.resgate:0}"></div></div>
    <div class="field"><label>Saldo total no fim do mês</label><input id="sSaldo" type="number" step="0.01" value="${ex?ex.saldo:''}" placeholder="0,00"></div>
    <button class="btn" onclick="saveSnap('${invId}')">Salvar</button>
    ${ex?`<button class="btn danger" style="margin-top:10px" onclick="delSnap('${ex.id}','${invId}')">Excluir este mês</button>`:''}
    <button class="btn sec" style="margin-top:8px" onclick="openInvDetail('${invId}')">Voltar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;
}
async function saveSnap(invId){
  const ym=document.getElementById('sMes').value;const ref=firstOfMonth(ym);
  const saldo=parseFloat(document.getElementById('sSaldo').value);
  if(isNaN(saldo)){toast('Informe o saldo');return;}
  const rec={investment_id:invId,household_id:household.id,ref_month:ref,
    aporte:parseFloat(document.getElementById('sAporte').value)||0,
    resgate:parseFloat(document.getElementById('sResg').value)||0,saldo,created_by:currentUser.id};
  const{data,error}=await _sb.from('investment_snapshots').upsert(rec,{onConflict:'investment_id,ref_month'}).select().single();
  if(error){toast('Erro ao salvar');return;}
  snaps=snaps.filter(s=>!(s.investment_id===invId&&ymOf(s.ref_month)===ym));snaps.push(data);
  openInvDetail(invId);renderInv();toast('Salvo ✓');
}
async function delSnap(id,invId){if(!confirm('Excluir este mês?'))return;
  const{error}=await _sb.from('investment_snapshots').delete().eq('id',id);if(error){toast('Erro');return;}
  snaps=snaps.filter(s=>s.id!==id);openInvDetail(invId);renderInv();toast('Excluído');}

/* ===================== BENCHMARKS (índices) ===================== */
function openBenchModal(){const ym=curMonth;const b=bmarks[ym]||{};
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>Índices do mês</h3>
    <div class="field"><label>Mês</label><input id="bMes" type="month" value="${ym}" onchange="loadBenchInputs()"></div>
    <p class="mut" style="font-size:12px;margin-top:0">Use o botão para buscar CDI e IPCA no Banco Central, ou digite manualmente (% no mês). O Ibovespa é manual.</p>
    <button class="btn sec" style="margin-bottom:12px" onclick="fetchBCB()">⤓ Buscar CDI e IPCA (BCB)</button>
    <div class="grid2">
      <div class="field"><label>CDI (% mês)</label><input id="bCdi" type="number" step="0.01" value="${b.cdi??''}"></div>
      <div class="field"><label>IPCA (% mês)</label><input id="bIpca" type="number" step="0.01" value="${b.ipca??''}"></div></div>
    <div class="field"><label>Ibovespa (% mês)</label><input id="bIbov" type="number" step="0.01" value="${b.ibov??''}"></div>
    <div id="bMsg" class="mut" style="font-size:12px;min-height:16px"></div>
    <button class="btn" onclick="saveBench()">Salvar índices</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Fechar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;
}
function loadBenchInputs(){const ym=document.getElementById('bMes').value;const b=bmarks[ym]||{};
  document.getElementById('bCdi').value=b.cdi??'';document.getElementById('bIpca').value=b.ipca??'';document.getElementById('bIbov').value=b.ibov??'';}
async function fetchBCB(){const ym=document.getElementById('bMes').value;const msg=document.getElementById('bMsg');
  msg.style.color='var(--mut)';msg.textContent='Buscando no Banco Central…';
  const alvo=ym.split('-');const alvoBR=alvo[2]?'':'';
  try{
    const cdi=await sgs(4391);const ipca=await sgs(433);
    const key=`01/${ym.slice(5,7)}/${ym.slice(0,4)}`;
    const c=cdi.find(x=>x.data===key),ip=ipca.find(x=>x.data===key);
    if(c)document.getElementById('bCdi').value=(+c.valor).toFixed(2);
    if(ip)document.getElementById('bIpca').value=(+ip.valor).toFixed(2);
    if(c||ip){msg.style.color='var(--accent)';msg.textContent='Índices carregados do BCB ✓ (confira e salve)';}
    else{msg.style.color='var(--amber)';msg.textContent='O mês pedido ainda não foi divulgado. Digite manualmente.';}
  }catch(e){msg.style.color='var(--amber)';msg.textContent='Não consegui buscar automaticamente (o navegador bloqueou a API do BCB). Digite os valores manualmente.';}
}
async function sgs(cod){
  const url=`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados/ultimos/24?formato=json`;
  const r=await fetch(url);if(!r.ok)throw new Error('http');return r.json();
}
async function saveBench(){const ym=document.getElementById('bMes').value;
  const rec={household_id:household.id,ref_month:firstOfMonth(ym),
    cdi:num(document.getElementById('bCdi').value),ipca:num(document.getElementById('bIpca').value),
    ibov:num(document.getElementById('bIbov').value),fonte:'app',updated_at:new Date().toISOString()};
  const{error}=await _sb.from('benchmarks').upsert(rec,{onConflict:'household_id,ref_month'});
  if(error){toast('Erro ao salvar');return;}
  bmarks[ym]={cdi:rec.cdi,ipca:rec.ipca,ibov:rec.ibov,fonte:'app'};closeModal();renderInv();toast('Índices salvos ✓');
}
function num(v){return v===''||v==null?null:parseFloat(v);}

/* ===================== RELATÓRIOS ===================== */
function renderRep(){updateMonthLabel();
  // últimos 6 meses evolução
  const months=[];for(let i=5;i>=0;i--){const[y,m]=curMonth.split('-').map(Number);const d=new Date(y,m-1-i,1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  const rec=months.map(ym=>monthTx(ym).reduce((s,t)=>s+(+t.receita||0),0));
  const desp=months.map(ym=>monthTx(ym).reduce((s,t)=>s+(+t.despesa||0),0));
  const maxV=Math.max(1,...rec,...desp);
  let h=`<div class="card"><h3>Evolução (6 meses)</h3><div style="display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:14px">`;
  months.forEach((ym,i)=>{h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end">
     <div style="display:flex;gap:2px;align-items:flex-end;height:100%">
       <div title="Receita" style="width:9px;background:var(--accent);border-radius:3px 3px 0 0;height:${rec[i]/maxV*100}%"></div>
       <div title="Despesa" style="width:9px;background:var(--red);border-radius:3px 3px 0 0;height:${desp[i]/maxV*100}%"></div></div>
     <div class="mut" style="font-size:10px">${MES[+ym.slice(5,7)-1]}</div></div>`;});
  h+=`</div><div class="row" style="gap:14px;margin-top:10px;font-size:12px"><span class="grn">■ Receitas</span><span class="red">■ Despesas</span></div></div>`;
  // top gastos do mês
  const tx=monthTx(curMonth).filter(t=>t.despesa>0).sort((a,b)=>b.despesa-a.despesa).slice(0,6);
  h+=`<div class="card"><h3>Maiores gastos do mês</h3>`;
  if(!tx.length)h+=`<p class="mut">Sem despesas.</p>`;
  tx.forEach(t=>h+=`<div class="tx"><div class="ic">${catIcon(t.categoria)}</div>
    <div class="d"><div class="t">${esc(t.descricao)}</div><div class="s">${esc(t.categoria.replace('(D) ',''))} · ${esc(memberName(t.createdBy))}</div></div>
    <div class="amt red">${money(t.despesa).replace('R$ ','')}</div></div>`);
  h+=`</div>`;
  // comparativo casal (6 meses)
  const byWho={};months.forEach(ym=>monthTx(ym).forEach(t=>{if(t.despesa>0){const n=memberName(t.createdBy);byWho[n]=(byWho[n]||0)+t.despesa;}}));
  if(Object.keys(byWho).length>0){const tot=Object.values(byWho).reduce((a,b)=>a+b,0)||1;
    h+=`<div class="card"><h3>Quem gastou mais (6 meses)</h3>`;
    Object.entries(byWho).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{h+=`<div style="margin-top:11px"><div class="between"><span>${esc(n)}</span><b>${money(v)} <span class="mut">(${(v/tot*100).toFixed(0)}%)</span></b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`;});
    h+=`</div>`;}
  document.getElementById('pgRep').innerHTML=h;
}

/* ===================== CASA / CONFIG ===================== */
function renderCasa(){
  let h=`<div class="card"><h3>${esc(household.nome)}</h3>
    <div class="between" style="margin-top:12px"><div><div class="mut" style="font-size:12px">Código de convite</div>
      <div style="font-size:24px;font-weight:800;letter-spacing:3px">${esc(household.invite_code)}</div></div>
      <button class="btn sm" onclick="copyCode()">Copiar</button></div>
    <p class="mut" style="font-size:12px">Envie este código para seu parceiro(a). Ele(a) cria a conta, escolhe "Entrar numa casa" e digita o código.</p></div>`;
  h+=`<div class="card"><h3>Membros</h3>`;
  members.forEach(m=>h+=`<div class="tx"><div class="ic">👤</div><div class="d"><div class="t">${esc(m.nome)}${m.user_id===currentUser.id?' <span class="who">você</span>':''}</div><div class="s">${esc(m.papel)}</div></div></div>`);
  h+=`</div>`;
  // categorias
  h+=`<div class="card"><div class="between"><h3>Categorias</h3><button class="btn sm sec" onclick="openCatModal()">Gerenciar</button></div>
    <p class="mut" style="font-size:12px">Padrão + personalizadas da casa. Toque em Gerenciar para adicionar, renomear ou excluir.</p></div>`;
  // backup
  h+=`<div class="card"><h3>Backup</h3>
    <div class="row" style="gap:8px;margin-top:10px"><button class="btn sm" onclick="exportBackup()">💾 Exportar</button>
    <button class="btn sm sec" onclick="document.getElementById('importFile').click()">📥 Importar</button></div>
    <p class="mut" style="font-size:12px">Exportar baixa um .json com todos os lançamentos e categorias. Importar substitui os lançamentos da casa pelos do arquivo.</p></div>`;
  h+=`<button class="btn sec" onclick="logout()">Sair da conta</button>`;
  h+=`<p class="mut center" style="font-size:11px;margin-top:16px">fin. · dados compartilhados com segurança (RLS)</p>`;
  document.getElementById('pgCasa').innerHTML=h;
}
function copyCode(){navigator.clipboard?.writeText(household.invite_code);toast('Código copiado ✓');}

function openCatModal(){
  const list=t=>allCats(t).map(c=>{const custom=customCats.some(cc=>cc.nome===c&&cc.tipo===t);
    return `<div class="tx"><div class="ic">${catIcon(c)}</div><div class="d"><div class="t">${esc(c)}</div><div class="s">${custom?'personalizada':'padrão'}</div></div>
      ${custom?`<button class="btn sm sec" onclick="renameCat('${esc(c)}','${t}')">✎</button> <button class="btn sm danger" onclick="delCat('${esc(c)}','${t}')">✕</button>`:''}</div>`;}).join('');
  const m=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="grabber"></div>
    <h3>Categorias</h3>
    <div class="row" style="gap:8px;margin-bottom:12px"><input id="ncNome" placeholder="Nova categoria" style="flex:1;padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--txt)">
      <select id="ncTipo" style="padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--txt)"><option value="d">Despesa</option><option value="r">Receita</option></select>
      <button class="btn sm" onclick="addCat()">Add</button></div>
    <div class="invhdr">Despesas</div>${list('d')}
    <div class="invhdr">Receitas</div>${list('r')}
    <button class="btn sec" style="margin-top:14px" onclick="closeModal()">Fechar</button></div></div>`;
  document.getElementById('modalRoot').innerHTML=m;
}
async function addCat(){const nome=document.getElementById('ncNome').value.trim();const tipo=document.getElementById('ncTipo').value;
  if(!nome){toast('Digite o nome');return;}
  if(allCats(tipo).includes(nome)){toast('Já existe');return;}
  const{error}=await _sb.from('custom_categories').insert({household_id:household.id,created_by:currentUser.id,nome,tipo,icone:catIcon(nome)});
  if(error){toast('Erro');return;}customCats.push({nome,tipo});openCatModal();toast('Adicionada ✓');}
async function delCat(nome,tipo){if(!confirm('Excluir a categoria "'+nome+'"? Os lançamentos que a usam continuam, mas sem categoria personalizada.'))return;
  const{error}=await _sb.from('custom_categories').delete().eq('household_id',household.id).eq('nome',nome).eq('tipo',tipo);
  if(error){toast('Erro');return;}customCats=customCats.filter(c=>!(c.nome===nome&&c.tipo===tipo));openCatModal();toast('Excluída');}
async function renameCat(nome,tipo){const novo=prompt('Novo nome para "'+nome+'":',nome);if(!novo||novo.trim()===nome)return;
  const nn=novo.trim();
  const{error}=await _sb.from('custom_categories').update({nome:nn}).eq('household_id',household.id).eq('nome',nome).eq('tipo',tipo);
  if(error){toast('Erro');return;}
  // atualiza lançamentos que usavam
  await _sb.from('transactions').update({categoria:nn}).eq('household_id',household.id).eq('categoria',nome);
  dados.forEach(t=>{if(t.categoria===nome)t.categoria=nn;});
  customCats.forEach(c=>{if(c.nome===nome&&c.tipo===tipo)c.nome=nn;});openCatModal();toast('Renomeada ✓');}

/* ===================== BACKUP ===================== */
function exportBackup(){
  const cats={d:allCats('d'),r:allCats('r')};
  const payload=JSON.stringify({v:2,dados:dados.map(t=>({id:t.id,data:t.data,mes:t.mes,descricao:t.descricao,tipo:t.tipo,
    categoria:t.categoria,receita:t.receita,despesa:t.despesa,pagamento:t.pagamento,parcelas:t.parcelas,parcelaAtual:t.parcelaAtual,grupoId:t.grupoId})),cats},null,2);
  const blob=new Blob([payload],{type:'application/json'});const a=document.createElement('a');
  const d=new Date();a.download=`fin_backup_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.href=URL.createObjectURL(blob);a.click();toast('Backup baixado ✓');
}
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  if(!confirm('Importar vai SUBSTITUIR todos os lançamentos da casa pelos do arquivo. Continuar?')){e.target.value='';return;}
  try{
    const parsed=JSON.parse(await f.text());
    if(!parsed.dados)throw new Error('formato');
    document.getElementById('loading').classList.remove('hide');
    // limpa e insere
    await _sb.from('transactions').delete().eq('household_id',household.id);
    const rows=parsed.dados.map(t=>localToDb({...t,createdBy:currentUser.id,
      parcelaAtual:t.parcelaAtual||t.parcela_atual,grupoId:t.grupoId||t.grupo_id}));
    for(let i=0;i<rows.length;i+=50)await _sb.from('transactions').insert(rows.slice(i,i+50));
    // categorias personalizadas do arquivo (as que não são padrão)
    if(parsed.cats){for(const tp of ['d','r']){for(const nome of (parsed.cats[tp]||[])){
      if(!DEFAULT_CATS[tp].includes(nome)&&!customCats.some(c=>c.nome===nome&&c.tipo===tp)){
        await _sb.from('custom_categories').insert({household_id:household.id,created_by:currentUser.id,nome,tipo:tp,icone:catIcon(nome)}).then(()=>customCats.push({nome,tipo:tp}),()=>{});}}}}
    await loadAll();document.getElementById('loading').classList.add('hide');go('dash');toast('Backup importado ✓');
  }catch(err){document.getElementById('loading').classList.add('hide');alert('Arquivo inválido ou erro ao importar.');}
  e.target.value='';
});

/* ===================== START ===================== */
_sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT')show('auth');});
(async()=>{updateMonthLabel();const{data:{session}}=await _sb.auth.getSession();
  if(session)await boot();else show('auth');})();
</script>
